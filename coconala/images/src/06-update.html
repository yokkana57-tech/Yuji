<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.h{position:absolute;left:70px;top:60px} h1{font-size:62px}
.steps{position:absolute;left:70px;right:70px;top:260px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.s{background:var(--card);border-radius:22px;padding:28px;border:2px solid var(--line);height:520px;display:flex;flex-direction:column}
.num{flex-shrink:0;width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;font-family:"Zen Maru Gothic";font-size:32px;display:grid;place-items:center}
.s h3{font-family:"Zen Maru Gothic";font-size:34px;margin:16px 0 8px}
.s p{font-size:24px;color:var(--sub);line-height:1.6}
.ui{margin-top:auto;height:210px;border-radius:12px;background:#F1ECE4;position:relative;overflow:hidden}
.bar{height:26px;background:#E2DACE}
.t{position:absolute;left:24px;right:24px;height:16px;border-radius:8px;background:#D6CCBE}
.sel{outline:3px dashed var(--acc);outline-offset:6px;background:#CBBFAE}
.cur{position:absolute;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:30px solid var(--ink);transform:rotate(-30deg)}
.edit{position:absolute;left:20px;right:20px;top:70px;height:70px;background:#fff;border:2px solid var(--acc);border-radius:8px;font-size:22px;padding:18px;color:var(--ink);white-space:nowrap}
.pub{position:absolute;right:20px;bottom:20px;background:var(--green);color:#fff;font-weight:700;font-size:22px;padding:10px 22px;border-radius:999px}
.cap{position:absolute;left:70px;bottom:50px;font-size:22px;color:var(--sub)}
</style>
<div class="h"><span class="label">納品後のこと</span><h1>値段も写真も、ご自身で変えられます</h1></div>
<div class="steps">
<div class="s"><div class="num">1</div><h3>変えたい所を<br>クリック</h3><p>スマホでもPCでも操作できます</p>
<div class="ui"><div class="bar"></div><div class="t" style="top:50px;width:50%"></div><div class="t sel" style="top:90px;width:70%"></div><div class="t" style="top:130px"></div><div class="cur" style="left:190px;top:100px"></div></div></div>
<div class="s"><div class="num">2</div><h3>文字や写真を<br>差しかえる</h3><p>「日替わり 850円」→「900円」のような変更も数秒です</p>
<div class="ui"><div class="bar"></div><div class="edit">日替わり定食 900円</div></div></div>
<div class="s"><div class="num">3</div><h3>「公開」を<br>押すだけ</h3><p>すぐにホームページに反映されます</p>
<div class="ui"><div class="bar"></div><div class="t" style="top:50px;width:50%"></div><div class="t" style="top:90px;width:70%"></div><div class="pub">公開する</div></div></div>
</div>
<div class="cap">※画面はイメージです。操作手順はお店に合わせた動画でお渡しします。</div>
<div class="foot"></div>
