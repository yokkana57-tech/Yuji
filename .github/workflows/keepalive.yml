# Supabase の無料プランは、1週間アクセスがないとサーバーが一時停止してアプリが使えなくなる。
# 毎日1回、公開データを読みにいって停止を防ぐ（公開キーだけを使う。秘密の値は使わない）。
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 21 * * *" # 毎日 6:17（日本時間）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read farms (public)
        run: |
          URL=$(grep -oE "supabaseUrl: '[^']+'" farm/config.js | cut -d"'" -f2)
          KEY=$(grep -oE "supabaseAnonKey: '[^']+'" farm/config.js | cut -d"'" -f2)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/farms?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "status: $code"
          test "$code" = "200"
