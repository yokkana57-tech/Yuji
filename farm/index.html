<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>やまぐち畑のとなり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #FFF6E3;
    --dot: #F6E4BE;
    --surface: #FFFFFF;
    --surface-2: #FFFBF2;
    --text: #2E2A24;
    --text-dim: #6E655A;
    --ink: #2E2A24;
    --line: #EADCC0;
    --leaf: #3FA34D;
    --leaf-ink: #FFFFFF;
    --leaf-soft: #DDF2D6;
    --tomato: #E8483B;
    --tomato-soft: #FFE0DB;
    --carrot: #F28C28;
    --carrot-soft: #FFE8CF;
    --corn: #F6C445;
    --corn-soft: #FFF2C7;
    --eggplant: #7B4A9E;
    --eggplant-soft: #EDE0F6;
    --pop-shadow: 3px 3px 0 var(--ink);
    --radius-sm: 12px;
    --radius-md: 18px;
    --radius-lg: 26px;
    --font-pop: "Mochiy Pop One", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", sans-serif;
    --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1A16;
      --dot: #26231D;
      --surface: #2A2620;
      --surface-2: #322D25;
      --text: #F6EEDF;
      --text-dim: #BFB3A1;
      --ink: #0B0A08;
      --line: #463F34;
      --leaf: #6CCB72;
      --leaf-ink: #10160F;
      --leaf-soft: #23361F;
      --tomato: #FF7A6B;
      --tomato-soft: #44221E;
      --carrot: #FFA552;
      --carrot-soft: #43301C;
      --corn: #F7D063;
      --corn-soft: #3E351A;
      --eggplant: #B98BDB;
      --eggplant-soft: #33263F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1A16;
    --dot: #26231D;
    --surface: #2A2620;
    --surface-2: #322D25;
    --text: #F6EEDF;
    --text-dim: #BFB3A1;
    --ink: #0B0A08;
    --line: #463F34;
    --leaf: #6CCB72;
    --leaf-ink: #10160F;
    --leaf-soft: #23361F;
    --tomato: #FF7A6B;
    --tomato-soft: #44221E;
    --carrot: #FFA552;
    --carrot-soft: #43301C;
    --corn: #F7D063;
    --corn-soft: #3E351A;
    --eggplant: #B98BDB;
    --eggplant-soft: #33263F;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 2px, transparent 2px);
    background-size: 22px 22px;
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 500;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 84px;
  }
  a { color: var(--leaf); font-weight: 700; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { font-family: var(--font-pop); font-weight: 400; line-height: 1.45; margin: 0; }

  header.top {
    position: sticky; top: 0; z-index: 1000;
    background: var(--leaf); border-bottom: 3px solid var(--ink);
  }
  .top-inner { max-width: 1080px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
  .brand { font-family: var(--font-pop); font-size: 1.2rem; text-decoration: none; color: #fff; text-shadow: 2px 2px 0 var(--ink); letter-spacing: .02em; line-height: 1.3; }
  .brand small { display: block; font-family: var(--font-body); font-size: .68rem; text-shadow: none; font-weight: 700; opacity: .95; }
  .brand .veg { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-3px) rotate(6deg); } }
  @media (prefers-reduced-motion: reduce) { .brand .veg { animation: none; } }
  .top-inner .spacer { flex: 1; }
  .theme-btn { background: var(--corn); border: 2.5px solid var(--ink); border-radius: 999px; width: 38px; height: 38px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); color: #2E2A24; }

  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
    background: var(--surface); border-top: 3px solid var(--ink);
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs a { text-decoration: none; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; padding: 7px 2px 6px; font-size: .68rem; gap: 1px; font-weight: 700; position: relative; }
  nav.tabs a .ic { font-size: 1.35rem; line-height: 1.1; transition: transform .15s; }
  nav.tabs a.on { color: var(--tomato); }
  nav.tabs a.on .ic { transform: scale(1.18) translateY(-2px); }
  nav.tabs .badge { position: absolute; top: 3px; right: calc(50% - 22px); background: var(--tomato); color: #fff; font-size: .6rem; border-radius: 999px; padding: 0 5px; border: 2px solid var(--surface); line-height: 1.4; }

  main { max-width: 1080px; margin: 0 auto; padding: 16px; }
  .dim { color: var(--text-dim); }
  .small { font-size: .82rem; }
  h2.sec { font-size: 1.12rem; margin: 30px 0 12px; display: flex; align-items: center; gap: 8px; }
  h2.sec .ic { display: inline-flex; width: 36px; height: 36px; align-items: center; justify-content: center; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--corn); font-size: 1.1rem; box-shadow: 2px 2px 0 var(--ink); flex: none; }

  .hero-intro {
    background: var(--surface); border: 3px solid var(--ink); border-radius: var(--radius-lg); box-shadow: 5px 5px 0 var(--ink);
    padding: 20px 18px; position: relative; overflow: hidden;
  }
  .hero-intro h1 { font-size: clamp(1.3rem, 5.4vw, 2rem); position: relative; }
  .hero-intro h1 .hl { background: linear-gradient(transparent 60%, var(--corn) 60%); padding: 0 2px; }
  .hero-intro p { margin: 8px 0 0; color: var(--text-dim); position: relative; max-width: 34em; }
  .hero-intro .float { position: absolute; font-size: 2.2rem; opacity: .9; }
  .hero-intro .float.a { right: 14px; top: 8px; transform: rotate(14deg); }
  .hero-intro .float.b { right: 58px; bottom: 6px; transform: rotate(-12deg); font-size: 1.8rem; }
  .hero-intro .float.c { right: 8px; bottom: 30px; font-size: 1.5rem; }
  .hero-intro.simple .float { display: none; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 10px; }
  .filters input[type=search] { flex: 1 1 220px; min-width: 0; padding: 10px 16px; border-radius: 999px; border: 2.5px solid var(--ink); background: var(--surface); box-shadow: 2px 2px 0 var(--ink); }
  .filters select { padding: 10px 12px; border-radius: 999px; border: 2.5px solid var(--ink); background: var(--surface); max-width: 100%; box-shadow: 2px 2px 0 var(--ink); }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
  .chip { border: 2.5px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 4px 13px; cursor: pointer; font-size: .85rem; font-weight: 700; box-shadow: 2px 2px 0 var(--ink); }
  .chip.on { background: var(--tomato); color: #fff; }
  .chip.on.leaf { background: var(--leaf); color: var(--leaf-ink); }
  .chip.on.corn { background: var(--corn); color: #2E2A24; }

  .map { height: 340px; border-radius: var(--radius-md); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); background: var(--leaf-soft); overflow: hidden; z-index: 0; }
  .map.small { height: 230px; }
  .map-fallback { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); padding: 16px; text-align: center; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 14px; }
  .card { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--radius-md); overflow: hidden; box-shadow: 4px 4px 0 var(--ink); text-decoration: none; color: inherit; display: flex; flex-direction: column; font-weight: 500; transition: transform .12s, box-shadow .12s; }
  .card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  .thumb { height: 116px; display: flex; align-items: center; justify-content: center; font-size: 3.4rem; position: relative; border-bottom: 3px solid var(--ink); }
  .thumb .loc { position: absolute; left: 10px; bottom: 8px; font-size: .74rem; background: #fff; color: #2E2A24; padding: 1px 10px; border-radius: 999px; border: 2px solid #2E2A24; font-weight: 700; }
  .thumb .meet { position: absolute; right: 10px; top: 8px; font-size: .7rem; background: var(--corn); color: #2E2A24; padding: 1px 9px; border-radius: 999px; border: 2px solid #2E2A24; font-weight: 700; transform: rotate(4deg); }
  .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-body h3 { font-size: 1.04rem; }
  .card-body .catch { font-weight: 700; font-size: .92rem; }
  .card .price-from { margin-top: auto; font-size: .82rem; color: var(--text-dim); }
  .card .price-from b { color: var(--tomato); font-size: 1rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: .72rem; padding: 0 9px; border-radius: 999px; background: var(--leaf-soft); color: var(--text); border: 1.5px solid var(--leaf); font-weight: 700; }
  .tag.tomato { background: var(--tomato-soft); border-color: var(--tomato); }
  .tag.carrot { background: var(--carrot-soft); border-color: var(--carrot); }
  .tag.corn { background: var(--corn-soft); border-color: var(--corn); }
  .tag.eggplant { background: var(--eggplant-soft); border-color: var(--eggplant); }
  .tag.plain { background: transparent; border-color: var(--line); color: var(--text-dim); }
  .empty { padding: 34px 16px; text-align: center; color: var(--text-dim); background: var(--surface); border: 2.5px dashed var(--line); border-radius: var(--radius-md); }

  .btn { border: 2.5px solid var(--ink); background: var(--tomato); color: #fff; border-radius: 999px; padding: 8px 18px; cursor: pointer; font-weight: 900; font-size: .92rem; text-decoration: none; display: inline-block; box-shadow: var(--pop-shadow); transition: transform .08s, box-shadow .08s; text-align: center; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.leaf { background: var(--leaf); color: var(--leaf-ink); }
  .btn.ghost { background: var(--surface); color: var(--text); }
  .btn.corn { background: var(--corn); color: #2E2A24; }
  .btn.small { padding: 3px 12px; font-size: .8rem; }
  .btn.danger { background: var(--surface); color: var(--tomato); }
  .btn.block { display: block; width: 100%; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  /* farm detail */
  .back { display: inline-block; margin-bottom: 10px; text-decoration: none; font-size: .9rem; }
  .farm-hero { border: 3px solid var(--ink); border-radius: var(--radius-lg); box-shadow: 5px 5px 0 var(--ink); padding: 24px 18px 20px; position: relative; overflow: hidden; color: #2E2A24; }
  .farm-hero .big-emoji { font-size: 4.4rem; position: absolute; right: 14px; top: 8px; transform: rotate(10deg); }
  .farm-hero .pref { font-size: .8rem; background: #fff; display: inline-block; padding: 1px 11px; border-radius: 999px; border: 2px solid #2E2A24; font-weight: 700; }
  .farm-hero h1 { font-size: clamp(1.45rem, 6vw, 2.1rem); margin-top: 10px; padding-right: 76px; }
  .farm-hero .who { margin-top: 2px; font-weight: 700; }
  .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }

  .bubble { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--radius-lg); padding: 20px 18px; font-size: 1rem; line-height: 2; white-space: pre-wrap; position: relative; box-shadow: 4px 4px 0 var(--ink); }
  .bubble::after { content: ""; position: absolute; bottom: -15px; right: 44px; width: 22px; height: 22px; background: var(--surface); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg); }
  .bubble-sign { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 18px; font-weight: 700; }
  .bubble-sign .face { width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: var(--corn-soft); }

  .two-col { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 760px) { .two-col { grid-template-columns: 1fr 1fr; } }

  .box { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--radius-md); box-shadow: 4px 4px 0 var(--ink); }
  .method { padding: 4px 16px; }
  .method dl { margin: 0; }
  .method .row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 10px 0; border-bottom: 2px dashed var(--line); }
  .method .row:last-child { border-bottom: none; }
  .method dt { color: var(--text-dim); font-size: .85rem; font-weight: 700; }
  .method dd { margin: 0; }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .fact { border: 2.5px solid var(--ink); border-radius: var(--radius-md); padding: 10px 6px; text-align: center; box-shadow: 3px 3px 0 var(--ink); }
  .fact:nth-child(1) { background: var(--leaf-soft); }
  .fact:nth-child(2) { background: var(--carrot-soft); }
  .fact:nth-child(3) { background: var(--eggplant-soft); }
  .fact b { display: block; font-family: var(--font-pop); font-weight: 400; font-size: 1.1rem; }
  .fact span { font-size: .72rem; color: var(--text-dim); font-weight: 700; }

  /* products to buy */
  .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .prod { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--radius-md); box-shadow: 4px 4px 0 var(--ink); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .prod.off { opacity: .7; }
  .prod h3 { font-size: 1rem; }
  .prod .unit { font-size: .8rem; color: var(--text-dim); font-weight: 700; }
  .prices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .price { border-radius: var(--radius-sm); padding: 6px 8px; border: 2px solid var(--ink); }
  .price.ship { background: var(--carrot-soft); }
  .price.pick { background: var(--leaf-soft); }
  .price small { display: block; font-size: .68rem; font-weight: 700; color: var(--text-dim); line-height: 1.3; }
  .price b { font-family: var(--font-pop); font-weight: 400; font-size: 1.05rem; }
  .stepper { display: flex; align-items: center; gap: 8px; margin-top: auto; }
  .stepper button { width: 36px; height: 36px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--corn); font-size: 1.2rem; font-weight: 900; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); line-height: 1; color: #2E2A24; }
  .stepper button:disabled { opacity: .35; cursor: not-allowed; }
  .stepper .qty { min-width: 28px; text-align: center; font-family: var(--font-pop); font-size: 1.1rem; }
  .stepper .stock { margin-left: auto; font-size: .76rem; color: var(--text-dim); font-weight: 700; }
  .stock.low { color: var(--tomato); }

  .cartbar { position: fixed; left: 12px; right: 12px; bottom: 74px; z-index: 1001; max-width: 640px; margin: 0 auto;
    background: var(--tomato); color: #fff; border: 3px solid var(--ink); border-radius: 999px; box-shadow: 4px 4px 0 var(--ink);
    display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 20px; font-weight: 900; }
  .cartbar .sum { flex: 1; line-height: 1.3; }
  .cartbar .sum small { display: block; font-size: .7rem; font-weight: 700; opacity: .95; }
  .cartbar .btn { background: #fff; color: #2E2A24; }

  /* season calendar */
  .cal { padding: 12px; overflow-x: auto; }
  .cal table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: .8rem; }
  .cal th { font-weight: 700; color: var(--text-dim); padding: 2px; text-align: center; }
  .cal th.now { color: var(--tomato); }
  .cal td { padding: 3px 1px; }
  .cal td.name { white-space: nowrap; padding-right: 10px; font-weight: 700; text-align: left; position: sticky; left: -12px; background: var(--surface); z-index: 1; padding-left: 12px; }
  .cal th:first-child { position: sticky; left: -12px; background: var(--surface); z-index: 1; }
  .cal td.cur { background: var(--corn-soft); }
  .cal .bar { height: 16px; border-radius: 6px; }
  .cal .bar.on { background: var(--leaf); border: 1.5px solid var(--ink); }
  .cal .bar.on.now { background: var(--tomato); }
  .legend { position: sticky; left: 0; width: max-content; max-width: 100%; font-size: .74rem; color: var(--text-dim); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; font-weight: 700; }
  .legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; border: 1.5px solid var(--ink); }

  /* posts / cheers */
  .posts { display: flex; flex-direction: column; gap: 12px; }
  .post { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--radius-md); box-shadow: 3px 3px 0 var(--ink); padding: 14px; display: grid; grid-template-columns: 54px 1fr; gap: 12px; }
  .post .pic { width: 54px; height: 54px; border-radius: 50%; border: 2.5px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
  .post h3 { font-size: .98rem; }
  .post .meta { font-size: .76rem; color: var(--text-dim); font-weight: 700; }
  .post .meta a { text-decoration: none; }
  .post p { margin: 4px 0 0; white-space: pre-wrap; }
  .post .del { margin-top: 8px; }
  .cheers { display: flex; flex-direction: column; gap: 10px; }
  .cheer { background: var(--corn-soft); border: 2.5px solid var(--ink); border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 4px; padding: 10px 14px; }
  .cheer .meta { font-size: .74rem; color: var(--text-dim); font-weight: 700; }
  .cheer p { margin: 2px 0 0; white-space: pre-wrap; }

  /* forms */
  .panel { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--radius-md); box-shadow: 4px 4px 0 var(--ink); padding: 16px; }
  .panel.soft { background: var(--surface-2); box-shadow: none; border-width: 2px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field > label, .field-label { font-size: .86rem; font-weight: 900; }
  .field .hint { font-size: .75rem; color: var(--text-dim); }
  .field input, .field select, .field textarea { padding: 9px 12px; border: 2px solid var(--ink); border-radius: var(--radius-sm); background: var(--surface-2); width: 100%; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 3px solid var(--corn); outline-offset: 1px; }
  .field textarea { min-height: 96px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .months, .weekdays { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .weekdays { grid-template-columns: repeat(7, 1fr); }
  .months label, .weekdays label { font-size: .8rem; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid var(--line); border-radius: 10px; padding: 4px 0; cursor: pointer; background: var(--surface-2); position: relative; }
  .months input, .weekdays input { position: absolute; opacity: 0; pointer-events: none; }
  .months label:has(input:checked), .weekdays label:has(input:checked) { background: var(--leaf); border-color: var(--ink); color: var(--leaf-ink); }
  .months label:has(input:focus-visible), .weekdays label:has(input:focus-visible) { outline: 3px solid var(--corn); }
  .emoji-pick { display: flex; flex-wrap: wrap; gap: 5px; }
  .emoji-pick label { font-size: 1.4rem; border: 2px solid var(--line); border-radius: 12px; padding: 1px 6px; cursor: pointer; background: var(--surface-2); position: relative; }
  .emoji-pick input { position: absolute; opacity: 0; pointer-events: none; }
  .emoji-pick label:has(input:checked) { border-color: var(--ink); background: var(--corn); }
  .prod-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .prod-item { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 2px solid var(--ink); border-radius: var(--radius-sm); padding: 6px 10px; font-size: .88rem; flex-wrap: wrap; }
  .prod-item span { flex: 1 1 160px; min-width: 0; }

  /* checkout */
  .choice { display: grid; gap: 10px; }
  .choice label { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; border: 2.5px solid var(--ink); border-radius: var(--radius-md); padding: 12px 14px; cursor: pointer; background: var(--surface-2); }
  .choice label:has(input:checked) { background: var(--leaf-soft); box-shadow: 3px 3px 0 var(--ink); }
  .choice label.pickup:has(input:checked) { background: var(--corn-soft); }
  .choice label:has(input:disabled) { opacity: .5; cursor: not-allowed; }
  .choice input { width: 20px; height: 20px; accent-color: var(--leaf); margin: 0; }
  .choice .t { font-weight: 900; line-height: 1.4; }
  .choice .t small { display: block; font-weight: 700; font-size: .76rem; color: var(--text-dim); }

  // ---------- 保存（この試作版は端末内の localStorage に保存） ----------
  const KEY = { mine: 'yamahata.myfarm', follows: 'yamahata.follows', cheers: 'yamahata.cheers', theme: 'yamahata.theme', orders: 'yamahata.orders', stock: 'yamahata.stock', buyer: 'yamahata.buyer' };
  const store = {
    get(k, fallback) {
      try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
    },
    set(k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('保存できませんでした（ブラウザの保存領域が使えません）'); return false; }
    }
  };

  const state = { q: '', cat: 'all', region: 'all', pest: 'all', inSeason: false, pickupOnly: false, feedMode: 'all' };
  // カートは農家ごと（受け取り場所・発送元が農家ごとに違うため、1回の注文は1農家にする）
  let cart = { farmId: null, items: {} };

  function myFarm() { return store.get(KEY.mine, null); }
  function allFarms() {
    const m = myFarm();
    return m && m.farmName ? [m, ...SAMPLE_FARMS] : SAMPLE_FARMS.slice();
  }
  function findFarm(id) { return allFarms().find(f => f.id === id); }
  function follows() { return store.get(KEY.follows, []); }
  function isFollowing(id) { return follows().includes(id); }
  function toggleFollow(id) {
    const f = follows();
    const i = f.indexOf(id);
    if (i >= 0) f.splice(i, 1); else f.push(id);
    store.set(KEY.follows, f);
    return i < 0;
  }
  function cheersFor(id) { return (store.get(KEY.cheers, {})[id] || []); }
  function addCheer(id, cheer) {
    const all = store.get(KEY.cheers, {});
    (all[id] = all[id] || []).unshift(cheer);
    store.set(KEY.cheers, all);
  }
  function orders() { return store.get(KEY.orders, []); }
  function saveOrders(list) { return store.set(KEY.orders, list); }

  // 在庫：自分の農園は登録データそのもの、サンプル農家は端末内の上書き値を使う
  function stockOf(f, p) {
    if (myFarm()?.id === f.id) return Number(p.stock) || 0;
    const ov = store.get(KEY.stock, {})[`${f.id}:${p.id}`];
    return typeof ov === 'number' ? ov : (Number(p.stock) || 0);
  }
  function takeStock(f, items) {
    const mine = myFarm();
    if (mine && mine.id === f.id) {
      mine.products.forEach(p => { if (items[p.id]) p.stock = Math.max(0, (Number(p.stock) || 0) - items[p.id]); });
      store.set(KEY.mine, mine);
      return;
    }
    const ov = store.get(KEY.stock, {});
    f.products.forEach(p => { if (items[p.id]) ov[`${f.id}:${p.id}`] = Math.max(0, stockOf(f, p) - items[p.id]); });
    store.set(KEY.stock, ov);
  }

  // ---------- ユーティリティ ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const yen = n => '¥' + Number(n || 0).toLocaleString('ja-JP');
  function hue(f) { return HUES[(f.hue || 0) % HUES.length]; }
  function fmtDate(d) {
    const t = new Date(d + 'T00:00:00');
    if (isNaN(t)) return esc(d);
    return `${t.getFullYear()}年${t.getMonth() + 1}月${t.getDate()}日`;
  }
  function fmtDay(d) {
    const t = new Date(d + 'T00:00:00');
    return isNaN(t) ? esc(d) : `${t.getMonth() + 1}月${t.getDate()}日（${WEEK[t.getDay()]}）`;
  }
  function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
  function today() { return ymd(new Date()); }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }
  function inSeason(p) { return (p.months || []).includes(NOW_MONTH); }
  function inSeasonNow(f) { return (f.products || []).some(inSeason); }
  function seasonalNames(f) { return (f.products || []).filter(inSeason).map(p => p.name); }
  function cats(f) { return [...new Set((f.products || []).map(p => p.cat))]; }
  function yearsFarming(f) { return f.since ? Math.max(0, new Date().getFullYear() - Number(f.since)) : null; }
  function regionOf(f) { return CITIES[f.city]?.r; }
  function canPickup(f) { return !!(f.pickup && f.pickup.enabled && (f.pickup.days || []).length); }
  function nextMonthOf(p) {
    for (let i = 1; i <= 12; i++) { const m = ((NOW_MONTH - 1 + i) % 12) + 1; if ((p.months || []).includes(m)) return m; }
    return null;
  }

  // ---------- 地図 ----------
  let maps = [];
  function clearMaps() { maps.forEach(m => { m.stop(); m.remove(); }); maps = []; }
  function makeMap(el, opts) {
    if (!window.L) {
      el.innerHTML = '<div class="map-fallback">地図を読み込めませんでした（オフラインの可能性があります）。<br>一覧からお選びください。</div>';
      return null;
    }
    const m = L.map(el, Object.assign({ scrollWheelZoom: false, maxBounds: YAMAGUCHI_BOUNDS, maxBoundsViscosity: 0.8, minZoom: 8 }, opts));
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(m);
    maps.push(m);
    return m;
  }
  function pinIcon(emoji) {
    return L.divIcon({ className: 'pin-wrap', html: `<div class="pin"><span>${emoji}</span></div>`, iconSize: [36, 36], iconAnchor: [4, 36], popupAnchor: [14, -34] });
  }

  // ---------- 画面: さがす ----------
  function filtered() {
    const q = state.q.trim().toLowerCase();
    return allFarms().filter(f => {
      if (state.cat !== 'all' && !cats(f).includes(state.cat)) return false;
      if (state.region !== 'all' && regionOf(f) !== state.region) return false;
      if (state.pest !== 'all' && f.methods?.pesticide !== state.pest) return false;
      if (state.inSeason && !inSeasonNow(f)) return false;
      if (state.pickupOnly && !canPickup(f)) return false;
      if (q) {
        const hay = [f.farmName, f.farmer, f.city, f.catch, f.story, ...(f.products || []).map(p => p.name)].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function farmCard(f) {
    const pest = PESTICIDE[f.methods?.pesticide];
    const season = seasonalNames(f);
    const mine = myFarm()?.id === f.id;
    const buyable = (f.products || []).filter(p => inSeason(p) && stockOf(f, p) > 0);
    const minPick = buyable.length ? Math.min(...buyable.map(p => canPickup(f) ? p.pickupPrice : p.shipPrice)) : null;
    return `
      <a class="card" href="#/farm/${esc(f.id)}">
        <div class="thumb" style="background:${hue(f)}">${esc(f.emoji)}<span class="loc">📍 ${esc(f.city)}</span>${canPickup(f) ? '<span class="meet">🚗 会いに行ける</span>' : ''}</div>
        <div class="card-body">
          <h3>${esc(f.farmName)}${mine ? ' <span class="tag corn">あなたの農園</span>' : ''}</h3>
          <div class="small dim">${esc(f.farmer)}${yearsFarming(f) !== null ? `・農業${yearsFarming(f)}年目` : ''}</div>
          <div class="catch">${esc(f.catch)}</div>
          <div class="tags">
            ${season.length ? `<span class="tag tomato">いま旬：${esc(season.slice(0, 2).join('・'))}</span>` : ''}
            ${pest && pest.short ? `<span class="tag">${esc(pest.short)}</span>` : ''}
            ${(f.certs || []).map(c => `<span class="tag eggplant">${esc(c)}</span>`).join('')}
          </div>
          <div class="price-from">${minPick !== null ? `いま買える：<b>${yen(minPick)}</b>〜${canPickup(f) ? '（畑で受け取り）' : '（送料込み）'}` : 'いま買えるものは準備中'}</div>
        </div>
      </a>`;
  }

  function renderExplore() {
    app.innerHTML = `
      <section class="hero-intro">
        <span class="float a">🍅</span><span class="float b">🥬</span><span class="float c">🍠</span>
        <h1>山口の<span class="hl">畑</span>と、<br>つくる人に会いにいこう。</h1>
        <p>どこで、だれが、どんな想いで育てたのか。<br>送料込みで届けてもらうことも、畑まで受け取りに行くこともできます。</p>
      </section>
      <div class="filters">
        <input type="search" id="q" placeholder="れんこん、みかん、萩…" value="${esc(state.q)}" aria-label="キーワード検索">
        <select id="pest" aria-label="育て方">
          <option value="all">育て方：すべて</option>
          <option value="none" ${state.pest === 'none' ? 'selected' : ''}>農薬 栽培期間中不使用</option>
          <option value="reduced" ${state.pest === 'reduced' ? 'selected' : ''}>農薬節減</option>
        </select>
      </div>
      <div class="chips" id="regionChips">
        <button class="chip leaf ${state.region === 'all' ? 'on' : ''}" data-region="all">県内ぜんぶ</button>
        ${Object.entries(REGIONS).map(([k, v]) => `<button class="chip leaf ${state.region === k ? 'on' : ''}" data-region="${k}">${v}</button>`).join('')}
      </div>
      <div class="chips" id="catChips">
        <button class="chip ${state.cat === 'all' ? 'on' : ''}" data-cat="all">すべて</button>
        ${Object.entries(CATS).map(([k, v]) => `<button class="chip ${state.cat === k ? 'on' : ''}" data-cat="${k}">${v}</button>`).join('')}
      </div>
      <div class="chips">
        <button class="chip corn ${state.inSeason ? 'on' : ''}" id="seasonChip">🌟 ${NOW_MONTH}月が旬</button>
        <button class="chip corn ${state.pickupOnly ? 'on' : ''}" id="pickupChip">🚗 畑で受け取りOK</button>
      </div>
      <h2 class="sec"><span class="ic">🗺️</span>山口の畑マップ</h2>
      <div class="map" id="map"></div>
      <h2 class="sec"><span class="ic">🧑‍🌾</span>農家さん <span class="dim small" id="count"></span></h2>
      <div class="grid" id="list"></div>
      <p class="notice">※ 掲載している農家さんは、山口の特産品をもとにした試作用の架空データです。</p>
    `;
    const map = makeMap($('#map'), { center: [34.2, 131.55], zoom: 8 });
    const layer = map ? L.layerGroup().addTo(map) : null;

    function update() {
      const list = filtered();
      $('#count').textContent = `${list.length}件`;
      $('#list').innerHTML = list.length ? list.map(farmCard).join('') : '<div class="empty">条件に合う農家さんが見つかりませんでした。</div>';
      if (layer) {
        layer.clearLayers();
        const pts = [];
        list.forEach(f => {
          if (typeof f.lat !== 'number' || typeof f.lng !== 'number') return;
          pts.push([f.lat, f.lng]);
          L.marker([f.lat, f.lng], { icon: pinIcon(f.emoji) })
            .bindPopup(`<b>${esc(f.farmName)}</b><br>${esc(f.city)}${canPickup(f) ? '・🚗受け取りOK' : ''}<br><a href="#/farm/${esc(f.id)}">農家さんのページへ →</a>`)
            .addTo(layer);
        });
        if (pts.length > 1) map.fitBounds(pts, { padding: [36, 36], maxZoom: 11, animate: false });
        else if (pts.length === 1) map.setView(pts[0], 11, { animate: false });
      }
    }

    $('#q').addEventListener('input', e => { state.q = e.target.value; update(); });
    $('#pest').addEventListener('change', e => { state.pest = e.target.value; update(); });
    function chipGroup(sel, key, attr) {
      $$(sel).forEach(b => b.addEventListener('click', () => {
        state[key] = b.dataset[attr];
        $$(sel).forEach(x => x.classList.toggle('on', x === b));
        update();
      }));
    }
    chipGroup('#regionChips [data-region]', 'region', 'region');
    chipGroup('#catChips [data-cat]', 'cat', 'cat');
    $('#seasonChip').addEventListener('click', e => { state.inSeason = !state.inSeason; e.currentTarget.classList.toggle('on', state.inSeason); update(); });
    $('#pickupChip').addEventListener('click', e => { state.pickupOnly = !state.pickupOnly; e.currentTarget.classList.toggle('on', state.pickupOnly); update(); });
    update();
  }

  // ---------- 画面: 農家さん詳細 ----------
  function seasonCalendar(products) {

  function pickupInfo(f) {
    if (!canPickup(f)) return '<div class="small dim" style="padding:14px 16px">この農家さんは現在、畑での受け取りをしていません（配送のみ）。</div>';

  function productCard(f, p) {
    const stock = stockOf(f, p);
    const season = inSeason(p);
    const qty = cart.farmId === f.id ? (cart.items[p.id] || 0) : 0;
    const next = nextMonthOf(p);
    const pick = canPickup(f);
    let foot;
    if (!season) foot = `<div class="small dim">🌱 ${next ? `${next}月ごろから` : ''}お届け予定</div>`;
    else if (stock <= 0) foot = '<div class="small" style="color:var(--tomato);font-weight:900">今季は売り切れました</div>';
    else foot = `
      <div class="stepper">
        <button type="button" data-dec="${esc(p.id)}" aria-label="${esc(p.name)}を減らす" ${qty <= 0 ? 'disabled' : ''}>−</button>
        <span class="qty" aria-live="polite">${qty}</span>
        <button type="button" data-inc="${esc(p.id)}" aria-label="${esc(p.name)}を増やす" ${qty >= stock ? 'disabled' : ''}>＋</button>
        <span class="stock ${stock <= 5 ? 'low' : ''}">${stock <= 5 ? `のこり${stock}` : `在庫${stock}`}</span>
      </div>`;
    return `
      <div class="prod ${season && stock > 0 ? '' : 'off'}">
        <div>
          <span class="tag ${CAT_COLOR[p.cat] || ''}">${CATS[p.cat] || ''}</span>
          ${season ? '<span class="tag tomato">いま旬</span>' : ''}
        </div>
        <h3>${esc(p.name)}</h3>
        <div class="unit">${esc(p.unit)}${p.note ? ` ・ ${esc(p.note)}` : ''}</div>
        <div class="prices" style="${pick ? '' : 'grid-template-columns:1fr'}">
          <div class="price ship"><small>📦 配送（送料込み）</small><b>${yen(p.shipPrice)}</b></div>
          ${pick ? `<div class="price pick"><small>🚗 畑で受け取り</small><b>${yen(p.pickupPrice)}</b></div>` : ''}
        </div>
        ${foot}
      </div>`;
  }

  function cartTotals(f) {
    let count = 0, ship = 0, pick = 0;
    (f.products || []).forEach(p => {
      const q = cart.farmId === f.id ? (cart.items[p.id] || 0) : 0;
      count += q; ship += q * p.shipPrice; pick += q * p.pickupPrice;
    });
    return { count, ship, pick };
  }

  function renderCartbar(f) {
    const slot = $('#cartbarSlot');
    if (!f || cart.farmId !== f.id) { slot.innerHTML = ''; return; }
    const t = cartTotals(f);
    if (!t.count) { slot.innerHTML = ''; return; }
    slot.innerHTML = `
      <div class="cartbar">
        <div class="sum">${t.count}点 ${yen(t.ship)}<small>${canPickup(f) ? `畑で受け取りなら ${yen(t.pick)}` : '送料込み'}</small></div>
        <a class="btn" href="#/checkout/${esc(f.id)}">注文へ進む →</a>
      </div>`;
  }

    const years = yearsFarming(f);

    const posts = (f.posts || []).slice().sort((a, b) => b.date.localeCompare(a.date));
    const products = (f.products || []).slice().sort((a, b) => (inSeason(b) - inSeason(a)));

    app.innerHTML = `
      <a class="back" href="#/">← 農家さん一覧へ</a>
      <section class="farm-hero" style="background:${hue(f)}">

    function changeQty(pid, d) {
      const p = f.products.find(x => x.id === pid);
      if (!p) return;
      if (cart.farmId !== f.id) {
        if (cart.farmId && Object.values(cart.items).some(Boolean)) {
          const other = findFarm(cart.farmId);
          if (!confirm(`カートに「${other ? other.farmName : '別の農家さん'}」の商品があります。\n注文は1回につき1軒の農家さんずつです。カートを入れ替えますか？`)) return;
        }
        cart = { farmId: f.id, items: {} };
      }
      cart.items[pid] = Math.max(0, Math.min(stockOf(f, p), (cart.items[pid] || 0) + d));
      const y = window.scrollY;
      $('.products').innerHTML = products.map(x => productCard(f, x)).join('');
      bindSteppers();
      window.scrollTo(0, y);
      renderCartbar(f);
    }
    function bindSteppers() {
      $$('[data-inc]').forEach(b => b.addEventListener('click', () => changeQty(b.dataset.inc, 1)));

      renderFarm(f.id);
      $('#cheerList').scrollIntoView({ behavior: 'smooth' });
    });
  }

  // ---------- 画面: 注文手続き ----------
  function pickupDates(f) {
    // 翌日から14日先まで、農家さんが受け取りできる曜日だけ
    const out = [];
    const d = new Date();
    for (let i = 1; i <= 14; i++) {
      const t = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i);
      if ((f.pickup.days || []).includes(t.getDay())) out.push(ymd(t));
    }
    return out;
  }

  function renderCheckout(id) {
    const f = findFarm(id);
    if (!f || !cartTotals(f).count) {
      app.innerHTML = `<a class="back" href="#/${f ? 'farm/' + esc(id) : ''}">← もどる</a><div class="empty">カートが空です。<br>農家さんのページで商品を選んでください。</div>`;
      return;
    }
    const lines = f.products.filter(p => cart.items[p.id]).map(p => ({ p, q: cart.items[p.id] }));
    const t = cartTotals(f);
    const pick = canPickup(f);
    const dates = pick ? pickupDates(f) : [];
    const buyer = store.get(KEY.buyer, {});
    const slots = pick ? Array.from({ length: Math.max(0, f.pickup.to - f.pickup.from) }, (_, i) => `${f.pickup.from + i}:00〜${f.pickup.from + i + 1}:00`) : [];

    app.innerHTML = `
      <a class="back" href="#/farm/${esc(f.id)}">← ${esc(f.farmName)}にもどる</a>
      <section class="hero-intro simple"><h1>ご注文手続き</h1><p>${esc(f.farmName)}（${esc(f.city)}）への注文です。</p></section>

      <form id="coForm" novalidate>
        <h2 class="sec"><span class="ic">🚚</span>受け取り方法</h2>
        <div class="choice">
          <label><input type="radio" name="method" value="ship" checked>
            <span class="t">📦 配送で届けてもらう<small>送料込み・発送したらお知らせします</small></span>
            <span class="p">${yen(t.ship)}</span></label>
          ${pick ? `<label class="pickup"><input type="radio" name="method" value="pickup" ${dates.length ? '' : 'disabled'}>
            <span class="t">🚗 畑まで受け取りに行く<small>${dates.length ? '送料なし・農家さんに直接会えます' : '2週間以内に受け取れる日がありません'}</small></span>
            <span class="p">${yen(t.pick)}</span></label>` : ''}
        </div>

        <h2 class="sec"><span class="ic">🧾</span>ご注文内容</h2>
        <div class="panel">
          <table class="lines">
            ${lines.map(({ p, q }) => `<tr><td>${esc(p.name)}<br><span class="small dim">${esc(p.unit)} × ${q}</span></td><td class="r" data-line="${esc(p.id)}"></td></tr>`).join('')}
            <tr class="total"><td>合計 <span class="small dim" id="taxNote"></span></td><td class="r" id="total"></td></tr>
          </table>
          <div id="saveNote" style="margin-top:6px"></div>
        </div>

        <div id="pickupFields" hidden>
          <h2 class="sec"><span class="ic">📅</span>受け取り日時</h2>
          <div class="panel">
            <div class="row2">
              <div class="field"><label for="pDate">日にち</label><select id="pDate">${dates.map(d => `<option value="${d}">${fmtDay(d)}</option>`).join('')}</select></div>
              <div class="field"><label for="pTime">時間</label><select id="pTime">${slots.map(s => `<option>${s}</option>`).join('')}</select></div>
            </div>
            <div class="small"><b>📍 ${esc(pick ? (f.pickup.place || f.city) : '')}</b></div>
            ${pick && f.pickup.note ? `<div class="small dim">${esc(f.pickup.note)}</div>` : ''}
            <div class="field" style="margin:12px 0 0"><label for="pMsg">農家さんへひとこと（任意）</label><input id="pMsg" maxlength="100" placeholder="例：子どもと一緒に行きます！"></div>
          </div>
        </div>

        <div id="shipFields">
          <h2 class="sec"><span class="ic">🏠</span>お届け先</h2>
          <div class="panel">
            <div class="row2">
              <div class="field"><label for="sZip">郵便番号</label><input id="sZip" inputmode="numeric" maxlength="8" placeholder="7530000" autocomplete="postal-code" value="${esc(buyer.zip || '')}"></div>
              <div class="field"><label for="sPref">都道府県</label><input id="sPref" maxlength="10" placeholder="山口県" autocomplete="address-level1" value="${esc(buyer.pref || '')}"></div>
            </div>
            <div class="field"><label for="sAddr">市区町村・番地・建物名</label><input id="sAddr" maxlength="120" autocomplete="street-address" value="${esc(buyer.addr || '')}"></div>
            <p class="small dim" style="margin:0">送料込みの価格は全国一律です。</p>
          </div>
        </div>

        <h2 class="sec"><span class="ic">🙋</span>ご連絡先</h2>
        <div class="panel">
          <div class="row2">
            <div class="field"><label for="bName">お名前</label><input id="bName" maxlength="40" autocomplete="name" value="${esc(buyer.name || '')}"></div>
            <div class="field"><label for="bTel">電話番号</label><input id="bTel" type="tel" maxlength="13" autocomplete="tel" placeholder="090-0000-0000" value="${esc(buyer.tel || '')}"></div>
          </div>
        </div>

        <h2 class="sec"><span class="ic">💳</span>お支払い（オンライン決済）</h2>
        <div class="choice">
          <label><input type="radio" name="pay" value="card" checked><span class="t">クレジットカード</span><span></span></label>
          <label><input type="radio" name="pay" value="paypay"><span class="t">PayPay</span><span></span></label>
          <label><input type="radio" name="pay" value="wallet"><span class="t">Apple Pay / Google Pay</span><span></span></label>
        </div>
        <p class="notice">🧪 これは試作版です。「注文を確定する」を押しても<b>実際の請求は発生しません</b>。カード番号などの入力もありません。本番では決済サービス（Stripe など）の画面でお支払いいただき、カード情報はこのアプリには保存しません。</p>

        <button class="btn block" type="submit" style="margin-top:16px;font-size:1.05rem;padding:12px" id="payBtn"></button>
      </form>
    `;

    function method() { return ($('input[name=method]:checked') || {}).value || 'ship'; }
    function refresh() {
      const mtd = method();
      lines.forEach(({ p, q }) => { $(`[data-line="${CSS.escape(p.id)}"]`).textContent = yen(q * (mtd === 'pickup' ? p.pickupPrice : p.shipPrice)); });
      const total = mtd === 'pickup' ? t.pick : t.ship;
      $('#total').textContent = yen(total);
      $('#taxNote').textContent = mtd === 'pickup' ? '（税込・送料なし）' : '（税込・送料込み）';
      $('#saveNote').innerHTML = mtd === 'pickup' && t.ship > t.pick ? `<span class="save">🚗 受け取りで ${yen(t.ship - t.pick)} おトク</span>` : '';
      $('#pickupFields').hidden = mtd !== 'pickup';
      $('#shipFields').hidden = mtd === 'pickup';
      $('#payBtn').textContent = `${yen(total)} を支払って注文を確定する（デモ）`;
    }
    $$('input[name=method]').forEach(r => r.addEventListener('change', refresh));
    refresh();

    $('#coForm').addEventListener('submit', e => {
      e.preventDefault();
      const mtd = method();
      const name = $('#bName').value.trim();
      const tel = $('#bTel').value.trim();
      if (mtd === 'ship') {
        if (!/^\d{3}-?\d{4}$/.test($('#sZip').value.trim())) { toast('郵便番号は7桁で入力してください'); $('#sZip').focus(); return; }
        if (!$('#sPref').value.trim()) { toast('都道府県を入力してください'); $('#sPref').focus(); return; }
        if (!$('#sAddr').value.trim()) { toast('住所を入力してください'); $('#sAddr').focus(); return; }
      }
      if (!name) { toast('お名前を入力してください'); $('#bName').focus(); return; }
      if (!/^0\d{1,4}-?\d{1,4}-?\d{3,4}$/.test(tel)) { toast('電話番号を確認してください'); $('#bTel').focus(); return; }
      // 在庫の再確認（他の注文で減っている可能性があるため）
      const short = lines.find(({ p, q }) => stockOf(f, p) < q);
      if (short) { toast(`「${short.p.name}」の在庫が足りなくなりました`); return; }

      const buyerInfo = { name, tel, zip: $('#sZip').value.trim(), pref: $('#sPref').value.trim(), addr: $('#sAddr').value.trim() };
      store.set(KEY.buyer, buyerInfo);
      const order = {
        id: 'o' + Date.now().toString(36) + uid().slice(0, 3),
        code: String(Math.floor(1000 + Math.random() * 9000)),
        farmId: f.id, farmName: f.farmName, farmEmoji: f.emoji, farmCity: f.city,
        items: lines.map(({ p, q }) => ({ name: p.name, unit: p.unit, qty: q, price: mtd === 'pickup' ? p.pickupPrice : p.shipPrice })),
        method: mtd,
        total: mtd === 'pickup' ? t.pick : t.ship,
        pickup: mtd === 'pickup' ? { date: $('#pDate').value, time: $('#pTime').value, place: f.pickup.place || f.city, msg: $('#pMsg').value.trim() } : null,
        ship: mtd === 'ship' ? { zip: buyerInfo.zip, pref: buyerInfo.pref, addr: buyerInfo.addr } : null,
        buyer: { name, tel },
        pay: ($('input[name=pay]:checked') || {}).value,
        status: 'paid',
        createdAt: new Date().toISOString()
      };
      const list = orders();
      list.unshift(order);
      if (!saveOrders(list)) return;
      takeStock(f, cart.items);
      cart = { farmId: null, items: {} };
      location.hash = `#/order/${order.id}?new=1`;
    });
  }

  // ---------- 画面: 注文 ----------
  const STATUS = {
    ship: [['paid', 'お支払い済み'], ['shipped', '発送済み'], ['done', 'お届け完了']],
    pickup: [['paid', 'お支払い済み'], ['ready', '準備OK'], ['done', '受け取り完了']]
  };
  function statusLabel(o) { return (STATUS[o.method].find(s => s[0] === o.status) || [, ''])[1]; }
  function statusSteps(o) {
    const st = STATUS[o.method];
    const idx = st.findIndex(s => s[0] === o.status);
    return `<div class="steps">${st.map((s, i) => `<div class="${i <= idx ? 'on' : ''}">${s[1]}</div>`).join('')}</div>`;
  }
  function orderCard(o, href) {
    return `
      <a class="order box" href="${href}">
        <div class="head"><b>${esc(o.farmEmoji)} ${esc(o.farmName)}</b><span class="status ${esc(o.status)}">${esc(statusLabel(o))}</span></div>
        <div class="small dim">${fmtDate(o.createdAt.slice(0, 10))} 注文 ・ ${o.method === 'pickup' ? `🚗 ${fmtDay(o.pickup.date)} ${esc(o.pickup.time)} 受け取り` : '📦 配送'}</div>
        <div class="small">${o.items.map(i => `${esc(i.name)}×${i.qty}`).join('、')}</div>
        <div><b>${yen(o.total)}</b></div>
      </a>`;
  }

  // ---------- 画面: 畑だより ----------
  function renderFeed() {

    const items = [];

    const shown = items.filter(x => state.feedMode === 'all' || fl.includes(x.f.id)).sort((a, b) => b.p.date.localeCompare(a.p.date));

      <div style="margin:16px 0">

          <button data-mode="all" class="${state.feedMode === 'all' ? 'on' : ''}">すべて</button>

        ${shown.length ? shown.map(x => postItem(x.p, x.f, { showFarm: true })).join('')
          : `<div class="empty">${state.feedMode === 'follow' ? 'フォロー中の農家さんの便りはまだありません。<br><a href="#/">農家さんをさがす →</a>' : 'まだ便りがありません。'}</div>`}
      </div>`;
    $$('#feedSeg button').forEach(b => b.addEventListener('click', () => { state.feedMode = b.dataset.mode; renderFeed(); }));
  }

  // ---------- 画面: フォロー ----------
  function renderFollows() {
    const list = follows().map(findFarm).filter(Boolean);
    app.innerHTML = `
      <section class="hero-intro"><span class="float a">💚</span><h1>フォロー中の農家さん</h1><p>フォローすると、畑だよりで近況を追いかけられます。</p></section>
      <div class="grid">${list.length ? list.map(farmCard).join('') : '<div class="empty">まだフォローしている農家さんはいません。<br><a href="#/">さがしにいく →</a></div>'}</div>`;
  }

  // ---------- 画面: 農家の方（登録・編集・投稿・注文管理） ----------
  let draftProducts = null;
  let editingIdx = -1;

  function blankFarm() {
    return {
      id: 'mine-' + uid(), farmName: '', farmer: '', city: '', lat: null, lng: null,
      since: '', area: '', emoji: '🥬', hue: 0, catch: '', story: '',
      methods: { pesticide: 'conventional', fertilizer: 'conventional', style: '露地', soil: '' },
      certs: [], products: [], posts: [],
      pickup: { enabled: true, place: '', days: [6], from: 9, to: 16, note: '' }
    };
  }

  function farmerOrders(f) {
    const list = orders().filter(o => o.farmId === f.id);
    if (!list.length) return '<div class="empty">まだ注文はありません。</div>';
    return list.map(o => {
      const pickup = o.method === 'pickup';
      let act = '';
      if (o.status === 'paid') act = pickup
        ? `<div><button class="btn corn small" data-adv="${esc(o.id)}" data-to="ready">準備できた</button></div>`
        : `<div><button class="btn corn small" data-adv="${esc(o.id)}" data-to="shipped">発送した</button></div>`;
      else if (o.status === 'ready') act = `
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <input data-code-for="${esc(o.id)}" inputmode="numeric" maxlength="4" placeholder="受け取りコード" aria-label="受け取りコード" style="width:140px;padding:4px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--surface-2)">
          <button class="btn leaf small" data-done="${esc(o.id)}">受け渡し完了</button></div>`;
      else if (o.status === 'shipped') act = `<div><button class="btn leaf small" data-adv="${esc(o.id)}" data-to="done">お届け完了にする</button></div>`;
      return `
        <div class="order box">
          <div class="head"><b>${esc(o.buyer.name)} さん</b><span class="status ${esc(o.status)}">${esc(statusLabel(o))}</span></div>
          <div class="small">${pickup ? `🚗 <b>${fmtDay(o.pickup.date)} ${esc(o.pickup.time)}</b> に受け取り` : `📦 配送：〒${esc(o.ship.zip)} ${esc(o.ship.pref)}${esc(o.ship.addr)}`}</div>
          <div class="small">${o.items.map(i => `${esc(i.name)}（${esc(i.unit)}）×${i.qty}`).join('、')}</div>
          ${pickup && o.pickup.msg ? `<div class="cheer small">💬 ${esc(o.pickup.msg)}</div>` : ''}
          <div class="small dim">📞 ${esc(o.buyer.tel)} ・ ${yen(o.total)}（支払い済み）</div>
          ${act}
        </div>`;
    }).join('');
  }

  function renderMine() {
    const existing = myFarm();
    const f = existing || blankFarm();
    if (!f.pickup) f.pickup = blankFarm().pickup;
    if (!draftProducts) draftProducts = (f.products || []).map(p => Object.assign({}, p));
    const cheers = existing ? cheersFor(f.id) : [];
    const posts = (f.posts || []).slice().sort((a, b) => b.date.localeCompare(a.date));
    const pendingOrders = existing ? orders().filter(o => o.farmId === f.id && o.status !== 'done').length : 0;
    const hours = Array.from({ length: 17 }, (_, i) => i + 5);

    app.innerHTML = `
      <section class="hero-intro"><span class="float a">👩‍🌾</span><span class="float b">🌱</span>
        <h1>${existing ? `${esc(f.farmName)}` : '農園を登録しよう'}</h1>
        <p>${existing ? `<a href="#/farm/${esc(f.id)}">公開ページを見る →</a>` : '畑の場所、育てているもの、そしてあなたの想いを書いてください。上手な文章じゃなくて大丈夫です。'}</p>
      </section>

      ${existing ? `
      <h2 class="sec"><span class="ic">🧾</span>届いた注文 ${pendingOrders ? `<span class="tag tomato">対応待ち ${pendingOrders}件</span>` : ''}</h2>
      <div class="order-list" id="farmerOrders">${farmerOrders(f)}</div>

      <h2 class="sec"><span class="ic">✏️</span>畑だよりを書く</h2>
      <form class="panel" id="postForm">
        <div class="field"><label for="pTitle">ひとこと（タイトル）</label><input id="pTitle" maxlength="40" required placeholder="例：きゅうりの初収穫！"></div>
        <div class="field"><label for="pBody">本文</label><textarea id="pBody" maxlength="600" placeholder="今日の畑のようす、作業のこと、天気のこと…"></textarea></div>
        <div class="field"><span class="field-label">アイコン</span>
          <div class="emoji-pick">${EMOJIS.map(e => `<label><input type="radio" name="pEmoji" value="${e}" ${e === (EMOJIS.includes(f.emoji) ? f.emoji : EMOJIS[0]) ? 'checked' : ''}>${e}</label>`).join('')}</div>
        </div>
        <button class="btn" type="submit">投稿する</button>
      </form>
      <div class="posts" style="margin-top:12px" id="myPosts">${posts.map(p => postItem(p, f, { deletable: true })).join('')}</div>

      <h2 class="sec"><span class="ic">💌</span>届いた声（${cheers.length}件）</h2>
      <div class="cheers">${cheers.length ? cheers.map(c => `<div class="cheer"><div class="meta">${esc(c.name || '匿名')} ・ ${fmtDate(c.date)}</div><p>${esc(c.text)}</p></div>`).join('') : '<div class="small dim">まだ届いていません。</div>'}</div>
      ` : ''}

      <h2 class="sec"><span class="ic">🏡</span>${existing ? 'プロフィールを編集' : '基本情報'}</h2>
      <form class="panel" id="farmForm" novalidate>
        <div class="row2">
          <div class="field"><label for="fName">農園名 *</label><input id="fName" maxlength="40" value="${esc(f.farmName)}" placeholder="例：さとう農園"></div>
          <div class="field"><label for="fFarmer">お名前 *</label><input id="fFarmer" maxlength="40" value="${esc(f.farmer)}" placeholder="例：佐藤 太郎"></div>
        </div>
        <div class="field"><label for="fCity">市町（山口県） *</label>
          <select id="fCity"><option value="">えらんでください</option>
            ${Object.entries(REGIONS).map(([rk, rv]) => `<optgroup label="${rv}">${Object.keys(CITIES).filter(c => CITIES[c].r === rk).map(c => `<option ${f.city === c ? 'selected' : ''}>${c}</option>`).join('')}</optgroup>`).join('')}
          </select></div>
        <div class="field">
          <span class="field-label">畑の位置</span>
          <span class="hint">地図をタップして、畑のだいたいの位置を指定してください。指定しない場合は市役所・町役場の付近に表示されます。</span>
          <div class="map small" id="pickMap"></div>
          <span class="hint" id="pickInfo">${typeof f.lat === 'number' && f.latPicked ? `指定済み（${f.lat.toFixed(3)}, ${f.lng.toFixed(3)}）` : 'まだ指定されていません'}</span>
        </div>
        <div class="row2">
          <div class="field"><label for="fSince">農業を始めた年</label><input id="fSince" type="number" min="1900" max="${new Date().getFullYear()}" value="${esc(f.since)}" placeholder="例：2015"></div>
          <div class="field"><label for="fArea">畑の広さ</label><input id="fArea" maxlength="20" value="${esc(f.area)}" placeholder="例：1.5ha / 30a"></div>
        </div>
        <div class="field"><span class="field-label">農園のアイコン</span>
          <div class="emoji-pick">${EMOJIS.map(e => `<label><input type="radio" name="fEmoji" value="${e}" ${f.emoji === e ? 'checked' : ''}>${e}</label>`).join('')}</div>
        </div>

        <h3 style="margin:20px 0 8px;font-size:1rem">💬 あなたの想い</h3>
        <div class="field"><label for="fCatch">ひとことで言うと？ *</label><input id="fCatch" maxlength="50" value="${esc(f.catch)}" placeholder="例：完熟まで待つ。それだけは譲れません。"></div>
        <div class="field"><label for="fStory">どんな想いで作っていますか？ *</label>
          <span class="hint">農業を始めたきっかけ、大切にしていること、食べる人に伝えたいこと。山口弁のままでOK！</span>
          <textarea id="fStory" maxlength="1500" style="min-height:160px">${esc(f.story)}</textarea></div>

        <h3 style="margin:20px 0 8px;font-size:1rem">🌱 育て方</h3>
        <div class="row2">
          <div class="field"><label for="fPest">農薬</label>
            <select id="fPest">${Object.entries(PESTICIDE).map(([k, v]) => `<option value="${k}" ${f.methods.pesticide === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select></div>
          <div class="field"><label for="fFert">化学肥料</label>
            <select id="fFert">${Object.entries(FERTILIZER).map(([k, v]) => `<option value="${k}" ${f.methods.fertilizer === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        </div>
        <div class="row2">
          <div class="field"><label for="fStyle">栽培方式</label>
            <select id="fStyle">${STYLES.map(s => `<option ${f.methods.style === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
          <div class="field"><label for="fCerts">認証など（カンマ区切り）</label><input id="fCerts" maxlength="80" value="${esc((f.certs || []).join(', '))}" placeholder="例：有機JAS, エコやまぐち"></div>
        </div>
        <div class="field"><label for="fSoil">こだわり</label><textarea id="fSoil" maxlength="400" placeholder="例：落ち葉堆肥で土づくり。">${esc(f.methods.soil)}</textarea></div>

        <h3 style="margin:20px 0 8px;font-size:1rem">🚗 畑での受け取り</h3>
        <div class="field"><label style="display:flex;gap:8px;align-items:center;font-weight:900"><input type="checkbox" id="pkOn" style="width:auto" ${f.pickup.enabled ? 'checked' : ''}> 畑での受け取りを受け付ける</label>
          <span class="hint">お客さんが畑まで取りに来ます。送料がかからない分、配送より安い価格を設定できます。</span></div>
        <div id="pkFields">
          <div class="field"><label for="pkPlace">受け取り場所</label><input id="pkPlace" maxlength="80" value="${esc(f.pickup.place)}" placeholder="例：畑の横の直売小屋"><span class="hint">ご自宅の住所は書かなくて大丈夫です。詳しい場所は注文後にお客さんへお伝えする想定です。</span></div>
          <div class="field"><span class="field-label">受け取りできる曜日</span>
            <div class="weekdays">${WEEK.map((w, i) => `<label><input type="checkbox" name="pkDay" value="${i}" ${(f.pickup.days || []).includes(i) ? 'checked' : ''}>${w}</label>`).join('')}</div></div>
          <div class="row2">
            <div class="field"><label for="pkFrom">何時から</label><select id="pkFrom">${hours.map(h => `<option value="${h}" ${f.pickup.from === h ? 'selected' : ''}>${h}:00</option>`).join('')}</select></div>
            <div class="field"><label for="pkTo">何時まで</label><select id="pkTo">${hours.map(h => `<option value="${h}" ${f.pickup.to === h ? 'selected' : ''}>${h}:00</option>`).join('')}</select></div>
          </div>
          <div class="field"><label for="pkNote">お客さんへひとこと</label><input id="pkNote" maxlength="80" value="${esc(f.pickup.note)}" placeholder="例：収穫体験もできます！"></div>
        </div>

        <h3 style="margin:20px 0 8px;font-size:1rem">🧺 売るもの *</h3>
        <div class="prod-list" id="prodList"></div>
        <div class="panel soft" id="prodEditor">
          <div class="row2">
            <div class="field"><label for="nName">品目名</label><input id="nName" maxlength="30" placeholder="例：ミニトマト"></div>
            <div class="field"><label for="nCat">種類</label><select id="nCat">${Object.entries(CATS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
          </div>
          <div class="row2">
            <div class="field"><label for="nUnit">1セットの量</label><input id="nUnit" maxlength="30" placeholder="例：2kg箱 / 3本入り"></div>
            <div class="field"><label for="nStock">在庫（セット数）</label><input id="nStock" type="number" min="0" max="9999" value="10"></div>
          </div>
          <div class="row2">
            <div class="field"><label for="nShip">配送価格（送料込み・税込）</label><input id="nShip" type="number" min="0" step="10" placeholder="例：3000"><span class="hint">全国一律。遠方の送料も含めた金額にしてください。</span></div>
            <div class="field"><label for="nPick">畑で受け取り価格（税込）</label><input id="nPick" type="number" min="0" step="10" placeholder="例：2000"></div>
          </div>
          <div class="field"><span class="field-label">お届けできる月</span>
            <div class="months" id="nMonths">${MONTHS.map(m => `<label><input type="checkbox" value="${m}">${m}月</label>`).join('')}</div></div>
          <div class="field"><label for="nNote">ひとことメモ</label><input id="nNote" maxlength="40" placeholder="例：皮ごと食べられます"></div>
          <button class="btn corn small" type="button" id="addProd">＋ この品目を追加</button>
          <button class="btn ghost small" type="button" id="cancelEdit" hidden>編集をやめる</button>
        </div>

        <div class="actions">
          <button class="btn" type="submit">${existing ? '変更を保存' : '登録して公開する'}</button>
          ${existing ? '<button class="btn danger" type="button" id="deleteFarm">登録を削除</button>' : ''}
        </div>
      </form>
      <p class="notice">試作版のため、登録内容と注文はこの端末のブラウザ内にだけ保存されます。本番版ではサーバーに保存し、農家さんの本人確認を行う想定です。</p>
    `;

    // 注文管理
    function advance(id, to) {
      const list = orders();
      const o = list.find(x => x.id === id);
      if (!o) return;
      o.status = to;
      if (saveOrders(list)) {
        toast(({ ready: 'お客さんに「準備OK」を知らせました', shipped: '発送済みにしました', done: '完了しました。ありがとうございました！' })[to]);
        $('#farmerOrders').innerHTML = farmerOrders(f);
        bindOrders();
        updateBadge();
      }
    }
    function bindOrders() {
      $$('[data-adv]').forEach(b => b.addEventListener('click', () => advance(b.dataset.adv, b.dataset.to)));
      $$('[data-done]').forEach(b => b.addEventListener('click', () => {
        const o = orders().find(x => x.id === b.dataset.done);
        const input = $(`[data-code-for="${CSS.escape(b.dataset.done)}"]`);
        if (!o || input.value.trim() !== o.code) { toast('受け取りコードがちがいます'); input.focus(); return; }
        advance(o.id, 'done');
      }));
    }
    if (existing) bindOrders();

    // 位置
    let picked = typeof f.lat === 'number' && f.latPicked ? [f.lat, f.lng] : null;
    const pm = makeMap($('#pickMap'), { center: picked || CITIES[f.city]?.c || [34.2, 131.55], zoom: (picked || f.city) ? 11 : 8 });
    let pmMarker = null;
    if (pm) {
      if (picked) pmMarker = L.marker(picked, { icon: pinIcon(f.emoji) }).addTo(pm);
      pm.on('click', e => {
        picked = [Math.round(e.latlng.lat * 1000) / 1000, Math.round(e.latlng.lng * 1000) / 1000];
        if (pmMarker) pmMarker.setLatLng(picked); else pmMarker = L.marker(picked, { icon: pinIcon(f.emoji) }).addTo(pm);
        $('#pickInfo').textContent = `指定済み（${picked[0].toFixed(3)}, ${picked[1].toFixed(3)}）`;
      });
    }
    $('#fCity').addEventListener('change', e => {
      const c = CITIES[e.target.value];
      if (pm && c && !picked) pm.setView(c.c, 11, { animate: false });
    });

    // 受け取り設定の表示切替
    function togglePk() { $('#pkFields').hidden = !$('#pkOn').checked; $('#nPick').disabled = !$('#pkOn').checked; }
    $('#pkOn').addEventListener('change', togglePk);
    togglePk();

    // 品目
    function drawProducts() {
      const pkOn = $('#pkOn').checked;
      $('#prodList').innerHTML = draftProducts.length ? draftProducts.map((p, i) => `
        <div class="prod-item"><span><b>${esc(p.name)}</b>（${esc(p.unit)}）<br><span class="dim small">${p.months.length === 12 ? '通年' : p.months.map(m => m + '月').join(' ')} ・ 配送${yen(p.shipPrice)}${pkOn ? ` / 受取${yen(p.pickupPrice)}` : ''} ・ 在庫${Number(p.stock) || 0}</span></span>
        <button class="btn ghost small" type="button" data-ed="${i}">編集</button>
        <button class="btn danger small" type="button" data-rm="${i}">削除</button></div>`).join('')
        : '<div class="small dim">まだ品目がありません。下のフォームから追加してください。</div>';
      $$('#prodList [data-rm]').forEach(b => b.addEventListener('click', () => { draftProducts.splice(Number(b.dataset.rm), 1); resetEditor(); drawProducts(); }));
      $$('#prodList [data-ed]').forEach(b => b.addEventListener('click', () => loadEditor(Number(b.dataset.ed))));
    }
    $('#pkOn').addEventListener('change', drawProducts);
    function resetEditor() {
      editingIdx = -1;
      ['#nName', '#nUnit', '#nShip', '#nPick', '#nNote'].forEach(s => { $(s).value = ''; });
      $('#nStock').value = 10;
      $$('#nMonths input').forEach(i => { i.checked = false; });
      $('#addProd').textContent = '＋ この品目を追加';
      $('#cancelEdit').hidden = true;
    }
    function loadEditor(i) {
      const p = draftProducts[i];
      editingIdx = i;
      $('#nName').value = p.name; $('#nCat').value = p.cat; $('#nUnit').value = p.unit || '';
      $('#nStock').value = Number(p.stock) || 0; $('#nShip').value = p.shipPrice; $('#nPick').value = p.pickupPrice; $('#nNote').value = p.note || '';
      $$('#nMonths input').forEach(x => { x.checked = p.months.includes(Number(x.value)); });
      $('#addProd').textContent = '✓ この内容で更新';
      $('#cancelEdit').hidden = false;
      $('#prodEditor').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    $('#cancelEdit').addEventListener('click', resetEditor);
    drawProducts();

    $('#addProd').addEventListener('click', () => {
      const name = $('#nName').value.trim();
      const months = $$('#nMonths input:checked').map(i => Number(i.value));
      const ship = Number($('#nShip').value);
      const pickOn = $('#pkOn').checked;
      const pick = pickOn ? Number($('#nPick').value) : ship;
      if (!name) { toast('品目名を入力してください'); $('#nName').focus(); return; }
      if (!$('#nUnit').value.trim()) { toast('1セットの量を入力してください'); $('#nUnit').focus(); return; }
      if (!(ship > 0)) { toast('配送価格（送料込み）を入力してください'); $('#nShip').focus(); return; }
      if (pickOn && !(pick > 0)) { toast('畑で受け取り価格を入力してください'); $('#nPick').focus(); return; }
      if (pick > ship) { toast('受け取り価格は配送価格（送料込み）以下にしてください'); $('#nPick').focus(); return; }
      if (!months.length) { toast('お届けできる月を1つ以上選んでください'); return; }
      const prev = editingIdx >= 0 ? draftProducts[editingIdx] : null;
      const p = { id: prev ? prev.id : 'p' + uid(), name, cat: $('#nCat').value, months, note: $('#nNote').value.trim(), unit: $('#nUnit').value.trim(), shipPrice: ship, pickupPrice: pick, stock: Math.max(0, Number($('#nStock').value) || 0) };
      if (prev) draftProducts[editingIdx] = p; else draftProducts.push(p);
      resetEditor();
      drawProducts();
      toast(prev ? '品目を更新しました（保存ボタンで確定）' : '品目を追加しました（保存ボタンで確定）');
    });

    $('#farmForm').addEventListener('submit', e => {
      e.preventDefault();
      const need = [['#fName', '農園名'], ['#fFarmer', 'お名前'], ['#fCity', '市町'], ['#fCatch', 'ひとこと'], ['#fStory', '想い']];
      const miss = need.find(([s]) => !$(s).value.trim());
      if (miss) { toast(`${miss[1]}を入力してください`); $(miss[0]).focus(); return; }
      if (!draftProducts.length) { toast('売るものを1つ以上追加してください'); $('#nName').focus(); return; }
      const pkOn = $('#pkOn').checked;
      const pkDays = $$('input[name=pkDay]:checked').map(i => Number(i.value));
      const from = Number($('#pkFrom').value), to = Number($('#pkTo').value);
      if (pkOn && !pkDays.length) { toast('受け取りできる曜日を選んでください'); return; }
      if (pkOn && to <= from) { toast('受け取り時間の「まで」は「から」より後にしてください'); $('#pkTo').focus(); return; }
      if (pkOn && draftProducts.some(p => !(p.pickupPrice > 0) || p.pickupPrice > p.shipPrice)) { toast('畑で受け取り価格が未設定の品目があります。「編集」から設定してください'); return; }
      const city = $('#fCity').value;
      const pos = picked || CITIES[city].c;
      const emoji = ($('input[name=fEmoji]:checked') || {}).value || '🥬';
      const saved = Object.assign({}, f, {
        farmName: $('#fName').value.trim(),
        farmer: $('#fFarmer').value.trim(),
        city,
        lat: pos[0], lng: pos[1], latPicked: !!picked,
        since: $('#fSince').value ? Number($('#fSince').value) : '',
        area: $('#fArea').value.trim(),
        emoji, hue: Math.max(0, EMOJIS.indexOf(emoji)) % HUES.length,
        catch: $('#fCatch').value.trim(),
        story: $('#fStory').value.trim(),
        methods: { pesticide: $('#fPest').value, fertilizer: $('#fFert').value, style: $('#fStyle').value, soil: $('#fSoil').value.trim() },
        certs: $('#fCerts').value.split(/[,、，]/).map(s => s.trim()).filter(Boolean),
        pickup: { enabled: pkOn, place: $('#pkPlace').value.trim(), days: pkDays, from, to, note: $('#pkNote').value.trim() },
        products: draftProducts.map(p => Object.assign({}, p, pkOn ? {} : { pickupPrice: p.shipPrice }))
      });
      if (store.set(KEY.mine, saved)) {
        draftProducts = null;
        toast(existing ? '保存しました' : '登録しました！畑だよりも書いてみましょう');
        if (existing) renderMine(); else location.hash = `#/farm/${saved.id}`;
      }
    });

    const del = $('#deleteFarm');
    if (del) del.addEventListener('click', () => {
      if (!confirm('農園の登録と、畑だよりをすべて削除します。よろしいですか？')) return;
      try { localStorage.removeItem(KEY.mine); } catch (err) { /* noop */ }
      draftProducts = null;
      toast('削除しました');
      renderMine();
    });

    const pf = $('#postForm');
    if (pf) pf.addEventListener('submit', e => {
      e.preventDefault();
      const cur = myFarm();
      const title = $('#pTitle').value.trim();
      if (!cur || !title) return;
      cur.posts = cur.posts || [];
      cur.posts.push({ id: uid(), date: today(), emoji: ($('input[name=pEmoji]:checked') || {}).value || cur.emoji, title, body: $('#pBody').value.trim() });
      if (store.set(KEY.mine, cur)) { toast('畑だよりを投稿しました'); draftProducts = null; renderMine(); }
    });
    $$('[data-del-post]').forEach(b => b.addEventListener('click', () => {
      if (!confirm('この投稿を削除しますか？')) return;
      const cur = myFarm();
      cur.posts = (cur.posts || []).filter(p => p.id !== b.dataset.delPost);
      if (store.set(KEY.mine, cur)) { draftProducts = null; renderMine(); }
    }));
  }

  // ---------- ルーティング ----------
  const app = $('#app');
  function updateBadge() {
    const n = orders().filter(o => o.status !== 'done').length;
    const a = $('#tabs a[data-tab=orders]');
    const b = a.querySelector('.badge');
    if (n && !b) a.insertAdjacentHTML('beforeend', `<span class="badge">${n}</span>`);
    else if (n && b) b.textContent = n;
    else if (!n && b) b.remove();
  }
  function route() {
    clearMaps();
    $('#cartbarSlot').innerHTML = '';
    const raw = location.hash.replace(/^#/, '') || '/';
    const [path, query] = raw.split('?');
    const parts = path.split('/').filter(Boolean);
    let tab = 'explore';
    if (parts[0] !== 'mine') { draftProducts = null; editingIdx = -1; }
    if (parts[0] === 'farm' && parts[1]) { renderFarm(decodeURIComponent(parts[1])); tab = ''; }
    else if (parts[0] === 'checkout' && parts[1]) { renderCheckout(decodeURIComponent(parts[1])); tab = ''; }
    else if (parts[0] === 'order' && parts[1]) { renderOrder(decodeURIComponent(parts[1]), /(^|&)new=1/.test(query || '')); tab = 'orders'; }
    else if (parts[0] === 'orders') { renderOrders(); tab = 'orders'; }
    else if (parts[0] === 'feed') { renderFeed(); tab = 'feed'; }
    else if (parts[0] === 'follows') { renderFollows(); tab = 'follows'; }
    else if (parts[0] === 'mine') { renderMine(); tab = 'mine'; }
    else renderExplore();
    $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
    updateBadge();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  // ---------- テーマ ----------
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  }
  applyTheme(store.get(KEY.theme, null));
  $('#themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    store.set(KEY.theme, next);
  });

  route();
})();
</script>
</body>
</html>
