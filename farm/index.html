<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>やまぐち畑のとなり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<!-- 本番接続の設定（Supabase の URL と公開キー）。無い・空ならお試し版として端末内だけで動く -->
<script src="config.js"></script>
<style>
  :root {
    --bg: #FFF6E3;
    --dot: #F6E4BE;
    --surface: #FFFFFF;
    --surface-2: #FFFBF2;
    --text: #2E2A24;
    --text-dim: #6E655A;
    --ink: #2E2A24;
    --line: #EADCC0;
    --sea: #BFE3F2;
    --leaf: #3FA34D;
    --leaf-ink: #FFFFFF;
    --leaf-soft: #DDF2D6;
    --tomato: #E8483B;
    --tomato-soft: #FFE0DB;
    --carrot: #F28C28;
    --carrot-soft: #FFE8CF;
    --corn: #F6C445;
    --corn-soft: #FFF2C7;
    --eggplant: #7B4A9E;
    --eggplant-soft: #EDE0F6;
    --land-west: #C6E8B4;
    --land-central: #FFE79C;
    --land-north: #FFD0A0;
    --land-east: #DEC8EE;
    --pop-shadow: 3px 3px 0 var(--ink);
    --radius-sm: 12px;
    --radius-md: 18px;
    --radius-lg: 26px;
    --font-pop: "Mochiy Pop One", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", sans-serif;
    --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1A16; --dot: #26231D; --surface: #2A2620; --surface-2: #322D25;
      --text: #F6EEDF; --text-dim: #BFB3A1; --ink: #0B0A08; --line: #463F34; --sea: #1D3440;
      --leaf: #6CCB72; --leaf-ink: #10160F; --leaf-soft: #23361F;
      --tomato: #FF7A6B; --tomato-soft: #44221E; --carrot: #FFA552; --carrot-soft: #43301C;
      --corn: #F7D063; --corn-soft: #3E351A; --eggplant: #B98BDB; --eggplant-soft: #33263F;
      --land-west: #3B5A33; --land-central: #5E5329; --land-north: #5E4630; --land-east: #4B3C5C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1A16; --dot: #26231D; --surface: #2A2620; --surface-2: #322D25;
    --text: #F6EEDF; --text-dim: #BFB3A1; --ink: #0B0A08; --line: #463F34; --sea: #1D3440;
    --leaf: #6CCB72; --leaf-ink: #10160F; --leaf-soft: #23361F;
    --tomato: #FF7A6B; --tomato-soft: #44221E; --carrot: #FFA552; --carrot-soft: #43301C;
    --corn: #F7D063; --corn-soft: #3E351A; --eggplant: #B98BDB; --eggplant-soft: #33263F;
    --land-west: #3B5A33; --land-central: #5E5329; --land-north: #5E4630; --land-east: #4B3C5C;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 2px, transparent 2px);
    background-size: 22px 22px;
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 500;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 84px;
  }
  a { color: var(--leaf); font-weight: 700; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { font-family: var(--font-pop); font-weight: 400; line-height: 1.45; margin: 0; }

  header.top { position: sticky; top: 0; z-index: 1000; background: var(--leaf); border-bottom: 3px solid var(--ink); }
  .top-inner { max-width: 1080px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
  .brand { font-family: var(--font-pop); font-size: 1.2rem; text-decoration: none; color: #fff; text-shadow: 2px 2px 0 var(--ink); letter-spacing: .02em; line-height: 1.3; }
  .brand small { display: block; font-family: var(--font-body); font-size: .68rem; text-shadow: none; font-weight: 700; opacity: .95; }
  .brand .veg { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-3px) rotate(6deg); } }
  @media (prefers-reduced-motion: reduce) { .brand .veg { animation: none; } }
  .top-inner .spacer { flex: 1; }
  .mode-tag { font-size: .66rem; font-weight: 900; background: var(--corn); color: #2E2A24; border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
  .theme-btn { background: var(--corn); border: 2.5px solid var(--ink); border-radius: 999px; width: 38px; height: 38px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); color: #2E2A24; flex: none; }

  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; background: var(--surface); border-top: 3px solid var(--ink); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs a { text-decoration: none; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; padding: 7px 2px 6px; font-size: .68rem; gap: 1px; font-weight: 700; position: relative; }
  nav.tabs a .ic { font-size: 1.35rem; line-height: 1.1; transition: transform .15s; }
  nav.tabs a.on { color: var(--tomato); }
  nav.tabs a.on .ic { transform: scale(1.18) translateY(-2px); }
  nav.tabs .badge { position: absolute; top: 3px; right: calc(50% - 22px); background: var(--tomato); color: #fff; font-size: .6rem; border-radius: 999px; padding: 0 5px; border: 2px solid var(--surface); line-height: 1.4; }

  main { max-width: 1080px; margin: 0 auto; padding: 16px; }
  .dim { color: var(--text-dim); }
  .small { font-size: .82rem; }
  h2.sec { font-size: 1.12rem; margin: 30px 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  h2.sec .ic { display: inline-flex; width: 36px; height: 36px; align-items: center; justify-content: center; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--corn); font-size: 1.1rem; box-shadow: 2px 2px 0 var(--ink); flex: none; }
  .loading { padding: 60px 0; text-align: center; color: var(--text-dim); font-weight: 700; }

  .hero-intro { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--radius-lg); box-shadow: 5px 5px 0 var(--ink); padding: 20px 18px; position: relative; overflow: hidden; }
  .hero-intro h1 { font-size: clamp(1.3rem, 5.4vw, 2rem); position: relative; }
  .hero-intro h1 .hl { background: linear-gradient(transparent 60%, var(--corn) 60%); padding: 0 2px; }
  .hero-intro p { margin: 8px 0 0; color: var(--text-dim); position: relative; max-width: 34em; }
  .hero-intro .float { position: absolute; font-size: 2.2rem; opacity: .9; pointer-events: none; }
  .hero-intro .float.a { right: 14px; top: 8px; transform: rotate(14deg); }
  .hero-intro .float.b { right: 58px; bottom: 6px; transform: rotate(-12deg); font-size: 1.8rem; }
  .hero-intro .float.c { right: 8px; bottom: 30px; font-size: 1.5rem; }
  .hero-intro.simple .float { display: none; }

  /* 地域えらび */
  .welcome { padding-bottom: 22px; }
  .place-search { position: relative; margin-top: 16px; }
  .place-search input { width: 100%; padding: 12px 16px; border-radius: 999px; border: 3px solid var(--ink); background: var(--surface-2); font-size: 1rem; box-shadow: 3px 3px 0 var(--ink); }
  .place-search input:focus { outline: 3px solid var(--corn); outline-offset: 2px; }
  .suggest { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .suggest button { text-align: left; border: 2.5px solid var(--ink); background: var(--surface); border-radius: var(--radius-sm); padding: 8px 14px; cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .suggest button small { color: var(--text-dim); font-weight: 700; font-size: .75rem; white-space: nowrap; }
  .suggest button:hover, .suggest button:focus-visible { background: var(--corn-soft); }
  .or { display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-size: .8rem; font-weight: 700; margin: 16px 0 10px; }
  .or::before, .or::after { content: ""; flex: 1; border-top: 2px dashed var(--line); }
  .city-groups { display: flex; flex-direction: column; gap: 8px; }
  .city-groups .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .city-groups .grp b { font-size: .78rem; width: 3em; color: var(--text-dim); }
  .home-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--surface); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 3px 3px 0 var(--ink); padding: 6px 8px 6px 16px; margin-top: 14px; font-weight: 700; }
  .home-bar .where { flex: 1; min-width: 0; }
  .home-bar .where b { font-family: var(--font-pop); font-weight: 400; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
  .filters input[type=search] { flex: 1 1 200px; min-width: 0; padding: 9px 16px; border-radius: 999px; border: 2.5px solid var(--ink); background: var(--surface); box-shadow: 2px 2px 0 var(--ink); }
  .filters select { padding: 9px 12px; border-radius: 999px; border: 2.5px solid var(--ink); background: var(--surface); max-width: 100%; box-shadow: 2px 2px 0 var(--ink); }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
  .chip { border: 2.5px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 4px 13px; cursor: pointer; font-size: .85rem; font-weight: 700; box-shadow: 2px 2px 0 var(--ink); }
  .chip.on { background: var(--tomato); color: #fff; }
  .chip.on.leaf { background: var(--leaf); color: var(--leaf-ink); }
  .chip.on.corn { background: var(--corn); color: #2E2A24; }
  .chip.sm { padding: 1px 10px; font-size: .8rem; box-shadow: 1.5px 1.5px 0 var(--ink); }

  /* 山口県マップ（SVG） */
  .ymap { position: relative; height: 340px; border-radius: var(--radius-md); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); background: var(--sea); overflow: hidden; user-select: none; -webkit-user-select: none; }
  .ymap.small { height: 240px; }
  .ymap svg { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .ymap.pick svg { cursor: crosshair; }
  .ymap .city { stroke: var(--ink); stroke-linejoin: round; }
  .ymap .city.west { fill: var(--land-west); } .ymap .city.central { fill: var(--land-central); }
  .ymap .city.north { fill: var(--land-north); } .ymap .city.east { fill: var(--land-east); }
  .ymap .city.focus { fill: var(--corn); }
  .ymap .lbl { fill: var(--text); font-family: var(--font-body); font-weight: 900; paint-order: stroke; stroke: var(--surface); stroke-linejoin: round; pointer-events: none; }
  .ymap .mpin { cursor: pointer; }
  .ymap .mpin .bg { fill: #fff; stroke: #2E2A24; }
  .ymap .mpin.sel .bg { fill: var(--corn); }
  .ymap .mpin.far { opacity: .45; }
  .ymap .radius { fill: color-mix(in srgb, var(--tomato) 12%, transparent); stroke: var(--tomato); stroke-dasharray: 6 5; }
  .ymap-ctrl { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .ymap-ctrl button { width: 38px; height: 38px; border-radius: 12px; border: 2.5px solid var(--ink); background: var(--surface); font-weight: 900; font-size: 1.1rem; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); line-height: 1; padding: 0; }
  .ymap-ctrl button.all { font-size: .64rem; }
  .ymap-credit { position: absolute; left: 8px; bottom: 4px; font-size: .58rem; color: var(--text-dim); background: color-mix(in srgb, var(--surface) 80%, transparent); padding: 0 6px; border-radius: 6px; pointer-events: none; }
  .map-pick { margin-top: 10px; }
  .mini { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 3px solid var(--ink); border-radius: var(--radius-md); box-shadow: 3px 3px 0 var(--ink); padding: 10px 12px; text-decoration: none; color: inherit; }
  .mini .em { width: 48px; height: 48px; border-radius: 50%; border: 2.5px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; flex: none; }
  .mini .tx { flex: 1; min-width: 0; line-height: 1.5; }
  .mini .go { font-weight: 900; color: var(--tomato); white-space: nowrap; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 14px; }
  .card { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--radius-md); overflow: hidden; box-shadow: 4px 4px 0 var(--ink); text-decoration: none; color: inherit; display: flex; flex-direction: column; font-weight: 500; transition: transform .12s, box-shadow .12s; }
  .card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  .thumb { height: 116px; display: flex; align-items: center; justify-content: center; font-size: 3.4rem; position: relative; border-bottom: 3px solid var(--ink); }
  .thumb .loc { position: absolute; left: 10px; bottom: 8px; font-size: .74rem; background: #fff; color: #2E2A24; padding: 1px 10px; border-radius: 999px; border: 2px solid #2E2A24; font-weight: 700; }
  .thumb .meet { position: absolute; right: 10px; top: 8px; font-size: .7rem; background: var(--corn); color: #2E2A24; padding: 1px 9px; border-radius: 999px; border: 2px solid #2E2A24; font-weight: 700; transform: rotate(4deg); }
  .thumb .dist { position: absolute; left: 10px; top: 8px; font-size: .74rem; background: var(--tomato); color: #fff; padding: 1px 10px; border-radius: 999px; border: 2px solid #2E2A24; font-weight: 900; }
  .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-body h3 { font-size: 1.04rem; }
  .card-body .catch { font-weight: 700; font-size: .92rem; }
  .card .price-from { margin-top: auto; font-size: .82rem; color: var(--text-dim); }
  .card .price-from b { color: var(--tomato); font-size: 1rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: .72rem; padding: 0 9px; border-radius: 999px; background: var(--leaf-soft); color: var(--text); border: 1.5px solid var(--leaf); font-weight: 700; }
  .tag.tomato { background: var(--tomato-soft); border-color: var(--tomato); }
  .tag.carrot { background: var(--carrot-soft); border-color: var(--carrot); }
  .tag.corn { background: var(--corn-soft); border-color: var(--corn); }
  .tag.eggplant { background: var(--eggplant-soft); border-color: var(--eggplant); }
  .tag.plain { background: transparent; border-color: var(--line); color: var(--text-dim); }
  .empty { padding: 30px 16px; text-align: center; color: var(--text-dim); background: var(--surface); border: 2.5px dashed var(--line); border-radius: var(--radius-md); }

  .btn { border: 2.5px solid var(--ink); background: var(--tomato); color: #fff; border-radius: 999px; padding: 8px 18px; cursor: pointer; font-weight: 900; font-size: .92rem; text-decoration: none; display: inline-block; box-shadow: var(--pop-shadow); transition: transform .08s, box-shadow .08s; text-align: center; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.leaf { background: var(--leaf); color: var(--leaf-ink); }
  .btn.ghost { background: var(--surface); color: var(--text); }
  .btn.corn { background: var(--corn); color: #2E2A24; }
  .btn.small { padding: 3px 12px; font-size: .8rem; }
  .btn.danger { background: var(--surface); color: var(--tomato); }
  .btn.block { display: block; width: 100%; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .linkbtn { background: none; border: none; color: var(--leaf); font-weight: 900; cursor: pointer; text-decoration: underline; padding: 4px; }

  .back { display: inline-block; margin-bottom: 10px; text-decoration: none; font-size: .9rem; }
  .farm-hero { border: 3px solid var(--ink); border-radius: var(--radius-lg); box-shadow: 5px 5px 0 var(--ink); padding: 24px 18px 20px; position: relative; overflow: hidden; color: #2E2A24; }
  .farm-hero .big-emoji { font-size: 4.4rem; position: absolute; right: 14px; top: 8px; transform: rotate(10deg); }
  .farm-hero .pref { font-size: .8rem; background: #fff; display: inline-block; padding: 1px 11px; border-radius: 999px; border: 2px solid #2E2A24; font-weight: 700; }
  .farm-hero h1 { font-size: clamp(1.45rem, 6vw, 2.1rem); margin-top: 10px; padding-right: 76px; }
  .farm-hero .who { margin-top: 2px; font-weight: 700; }
  .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }

  .bubble { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--radius-lg); padding: 20px 18px; font-size: 1rem; line-height: 2; white-space: pre-wrap; position: relative; box-shadow: 4px 4px 0 var(--ink); }
  .bubble::after { content: ""; position: absolute; bottom: -15px; right: 44px; width: 22px; height: 22px; background: var(--surface); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg); }
  .bubble-sign { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 18px; font-weight: 700; }
  .bubble-sign .face { width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: var(--corn-soft); }

  .two-col { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 760px) { .two-col { grid-template-columns: 1fr 1fr; } }

  .box { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--radius-md); box-shadow: 4px 4px 0 var(--ink); }
  .method { padding: 4px 16px; }
  .method dl { margin: 0; }
  .method .row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 10px 0; border-bottom: 2px dashed var(--line); }
  .method .row:last-child { border-bottom: none; }
  .method dt { color: var(--text-dim); font-size: .85rem; font-weight: 700; }
  .method dd { margin: 0; }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .fact { border: 2.5px solid var(--ink); border-radius: var(--radius-md); padding: 10px 6px; text-align: center; box-shadow: 3px 3px 0 var(--ink); }
  .fact:nth-child(1) { background: var(--leaf-soft); }
  .fact:nth-child(2) { background: var(--carrot-soft); }
  .fact:nth-child(3) { background: var(--eggplant-soft); }
  .fact b { display: block; font-family: var(--font-pop); font-weight: 400; font-size: 1.1rem; }
  .fact span { font-size: .72rem; color: var(--text-dim); font-weight: 700; }

  .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .prod { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--radius-md); box-shadow: 4px 4px 0 var(--ink); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .prod.off { opacity: .7; }
  .prod h3 { font-size: 1rem; }
  .prod .unit { font-size: .8rem; color: var(--text-dim); font-weight: 700; }
  .prices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .price { border-radius: var(--radius-sm); padding: 6px 8px; border: 2px solid var(--ink); }
  .price.ship { background: var(--carrot-soft); }
  .price.pick { background: var(--leaf-soft); }
  .price small { display: block; font-size: .68rem; font-weight: 700; color: var(--text-dim); line-height: 1.3; }
  .price b { font-family: var(--font-pop); font-weight: 400; font-size: 1.05rem; }
  .stepper { display: flex; align-items: center; gap: 8px; margin-top: auto; }
  .stepper button { width: 36px; height: 36px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--corn); font-size: 1.2rem; font-weight: 900; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); line-height: 1; color: #2E2A24; }
  .stepper button:disabled { opacity: .35; cursor: not-allowed; }
  .stepper .qty { min-width: 28px; text-align: center; font-family: var(--font-pop); font-size: 1.1rem; }
  .stepper .stock { margin-left: auto; font-size: .76rem; color: var(--text-dim); font-weight: 700; }
  .stock.low { color: var(--tomato); }

  .cartbar { position: fixed; left: 12px; right: 12px; bottom: 74px; z-index: 1001; max-width: 640px; margin: 0 auto; background: var(--tomato); color: #fff; border: 3px solid var(--ink); border-radius: 999px; box-shadow: 4px 4px 0 var(--ink); display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 20px; font-weight: 900; }
  .cartbar .sum { flex: 1; line-height: 1.3; }
  .cartbar .sum small { display: block; font-size: .7rem; font-weight: 700; opacity: .95; }
  .cartbar .btn { background: #fff; color: #2E2A24; }

  .cal { padding: 12px; overflow-x: auto; }
  .cal table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: .8rem; }
  .cal th { font-weight: 700; color: var(--text-dim); padding: 2px; text-align: center; }
  .cal th.now { color: var(--tomato); }
  .cal td { padding: 3px 1px; }
  .cal td.name { white-space: nowrap; padding-right: 10px; font-weight: 700; text-align: left; position: sticky; left: -12px; background: var(--surface); z-index: 1; padding-left: 12px; }
  .cal th:first-child { position: sticky; left: -12px; background: var(--surface); z-index: 1; }
  .cal td.cur { background: var(--corn-soft); }
  .cal .bar { height: 16px; border-radius: 6px; }

  // ---------- ユーティリティ ----------
  const $ = (sel, root = document) => root.querySelector(sel);

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function fmtDate(d) { const t = new Date(String(d).length <= 10 ? d + 'T00:00:00' : d); return isNaN(t) ? esc(d) : `${t.getFullYear()}年${t.getMonth() + 1}月${t.getDate()}日`; }
  function fmtDay(d) { const t = new Date(d + 'T00:00:00'); return isNaN(t) ? esc(d) : `${t.getMonth() + 1}月${t.getDate()}日（${WEEK[t.getDay()]}）`; }
  function fmtDateTime(iso) { const t = new Date(iso); return isNaN(t) ? '' : `${t.getMonth() + 1}月${t.getDate()}日（${WEEK[t.getDay()]}）${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}`; }
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = () => ymd(new Date());

  function km(a, b) {
    const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;

  // 「山口市仁保」「徳地」「萩 須佐」などを、町名データから探す
  function searchPlaces(raw) {
    let q = String(raw || '').replace(/[\s　]/g, '').replace(/^山口県/, '').replace(/ケ/g, 'ヶ');
    if (!q) return [];
    let city = null;
    for (const c of CITY_NAMES) {
      const short = c.replace(/[市町]$/, '');
      if (q.startsWith(c)) { city = c; q = q.slice(c.length); break; }
      if (q.startsWith(short) && short.length >= 2 && (q === short || !PLACES.some(p => p.name.startsWith(q)))) { city = c; q = q.slice(short.length); break; }
    }
    const out = [];
    if (city && !q) {
      const [lat, lng] = CITY_CENTER[city];
      out.push({ label: city, sub: '市町の中心あたり', lat, lng, city });
    }
    if (q) {
      const pool = PLACES.filter(p => !city || p.city === city);
      const starts = pool.filter(p => p.name.startsWith(q));
      const incl = pool.filter(p => !p.name.startsWith(q) && p.name.includes(q));
      // 同じ市町で「徳地◯◯」のように複数ある → 「徳地」一帯としてまとめる
      const byCity = {};
      starts.forEach(p => { (byCity[p.city] = byCity[p.city] || []).push(p); });
      Object.entries(byCity).forEach(([c, list]) => {
        if (list.length > 1 && !list.some(p => p.name === q)) {
          out.push({ label: `${c} ${q}`, sub: `${list.length}地区のあたり`, lat: list.reduce((s, p) => s + p.lat, 0) / list.length, lng: list.reduce((s, p) => s + p.lng, 0) / list.length, city: c });
        }
      });
      starts.concat(incl).forEach(p => out.push({ label: `${p.city} ${p.name}`, sub: '', lat: p.lat, lng: p.lng, city: p.city }));
    }
    return out.slice(0, 8);
  }
  function nearestPlace(lat, lng) {
    let best = null, bd = Infinity;
    PLACES.forEach(p => { const d = km({ lat, lng }, p); if (d < bd) { bd = d; best = p; } });
    return best;
  }

        since: f.since || null, area: f.area, emoji: f.emoji, hue: f.hue, catch: f.catch, story: f.story,

        const { data, error } = await this.sb.from('farms').insert(row).select('id').single();

        const { error } = await this.sb.from('products').delete().in('id', removed);
        if (error) throw error;

      for (const [i, p] of f.products.entries()) {

    changeStock(f, items, sign) {
      const m = store.get(KEY.mine, null);
      if (m && m.id === f.id) {
        m.products.forEach(p => { const it = items.find(i => i.product_id === p.id); if (it) p.stock = Math.max(0, (Number(p.stock) || 0) + sign * it.qty); });
        store.set(KEY.mine, m);
        return;
      }
      const ov = this.stockOverrides();
      f.products.forEach(p => { const it = items.find(i => i.product_id === p.id); if (it) ov[`${f.id}:${p.id}`] = Math.max(0, p.stock + sign * it.qty); });
      store.set(KEY.stock, ov);

    // サーバー側（create_order）と同じルールで検証する
    async placeOrder(pl) {
      const f = DATA.farms.find(x => x.id === pl.farm_id);
      if (!f) throw new Error('この農家さんは見つかりませんでした。');
      if (!(pl.buyer.name || '').trim()) throw new Error('お名前を入力してください。');
      if (!TEL_RE.test(pl.buyer.tel)) throw new Error('電話番号を確認してください。');
      if (pl.method === 'ship' && !ZIP_RE.test(pl.ship.zip)) throw new Error('配送は山口県内（郵便番号 740〜759）のみです。');
      const lines = pl.items.map(it => {
        const p = f.products.find(x => x.id === it.product_id);
        if (!p || !inSeason(p)) throw new Error('いまはお届けできない時期の商品があります');
        if (p.stock < it.qty) throw new Error(`在庫が足りない商品があります（${p.name}）`);
        return { product_id: p.id, name: p.name, unit: p.unit, qty: it.qty, price: pl.method === 'pickup' ? p.pickupPrice : p.shipPrice };
      });
      let deadline = Date.now() + (f.cancelDays || 2) * 86400000;
      if (pl.method === 'pickup') deadline = Math.min(deadline, new Date(pl.pickup.date + 'T00:00:00').getTime());
      const order = {
        id: 'o' + Date.now().toString(36) + uid().slice(0, 3),
        code: String(Math.floor(1000 + Math.random() * 9000)),
        farmId: f.id, farmName: f.farmName, farmEmoji: f.emoji, farmCity: f.city, farmLat: f.lat, farmLng: f.lng,
        items: lines, method: pl.method, total: lines.reduce((s, l) => s + l.qty * l.price, 0),
        pickup: pl.method === 'pickup' ? { date: pl.pickup.date, hour: pl.pickup.hour, time: `${pl.pickup.hour}:00〜${pl.pickup.hour + 1}:00`, place: f.pickup.place || f.city, msg: pl.pickup.msg } : null,
        ship: pl.method === 'ship' ? { zip: pl.ship.zip, pref: '山口県', addr: pl.ship.addr } : null,
        buyer: pl.buyer, status: 'paid', cancelDeadline: new Date(deadline).toISOString(), createdAt: new Date().toISOString()
      };
      const list = store.get(KEY.orders, []);
      list.unshift(order);
      if (!store.set(KEY.orders, list)) throw new Error('保存できませんでした');
      this.changeStock(f, lines, -1);
      return { orderId: order.id };
    },
    async myOrders() { return store.get(KEY.orders, []); },
    async order(id) { return store.get(KEY.orders, []).find(o => o.id === id) || null; },
    async cancelOrder(id) {
      const list = store.get(KEY.orders, []);
      const o = list.find(x => x.id === id);
      if (!o || o.status !== 'paid' || Date.now() >= new Date(o.cancelDeadline).getTime()) throw new Error('この注文はキャンセルできません（期限切れ、または農家さんが準備を始めています）。');
      o.status = 'canceled'; o.refundStatus = 'refunded';
      store.set(KEY.orders, list);
      const f = DATA.farms.find(x => x.id === o.farmId);
      if (f) this.changeStock(f, o.items, +1);
      return { status: 'canceled' };
    },

      if (!ok) throw new Error('この注文はもう更新できません（キャンセルされた可能性があります）');
      if (o.method === 'pickup' && to === 'done' && code !== o.code) throw new Error('受け取りコードがちがいます');
      o.status = to;
      store.set(KEY.orders, list);

  // ======================================================================
  //  山口県マップ（外部サービスを使わない SVG）
  // ======================================================================
  function YMap(el, opts) {
    const V = GEO.view;
    const small = !!opts.small;
    el.innerHTML = `
      <div class="ymap ${small ? 'small' : ''} ${opts.pickable ? 'pick' : ''}">
        <svg role="img" aria-label="山口県の地図">
          <g class="land">${CITY_NAMES.map(c => `<path class="city ${REGION_OF[c]} ${opts.focusCity === c ? 'focus' : ''}" data-city="${c}" d="${GEO.cities[c].d}" fill-rule="evenodd"/>`).join('')}</g>
          <g class="over"></g>
        </svg>
        <div class="ymap-ctrl"><button type="button" data-z="in" aria-label="拡大">＋</button><button type="button" data-z="out" aria-label="縮小">－</button><button type="button" class="all" data-z="all" aria-label="県全体を表示">全体</button></div>
        <div class="ymap-credit">国土数値情報（行政区域）を加工</div>
      </div>`;
    const wrap = el.firstElementChild, svg = $('svg', wrap), over = $('.over', svg);
    let vb = null;
    const size = () => [svg.clientWidth || 300, svg.clientHeight || 300];

    function fit(box) { // box: [x0, y0, x1, y1]
      const [cw, ch] = size();
      let w = box[2] - box[0], h = box[3] - box[1];
      const cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2;
      if (w / h > cw / ch) h = w * ch / cw; else w = h * cw / ch;
      vb = [cx - w / 2, cy - h / 2, w, h];
      clamp(); draw();
    }
    function boxAround(lat, lng, radiusKm) {
      const [x, y] = toXY(lat, lng), r = radiusKm * KM;
      return [x - r, y - r, x + r, y + r];
    }
    function fitAll() { fit([V[0], V[1], V[0] + V[2], V[1] + V[3]]); }
    function clamp() {
      const [cw, ch] = size();
      const maxW = V[2] * 1.15, minW = 40;
      if (vb[2] > maxW) { const s = maxW / vb[2]; vb[0] += vb[2] * (1 - s) / 2; vb[1] += vb[3] * (1 - s) / 2; vb[2] = maxW; vb[3] = maxW * ch / cw; }
      if (vb[2] < minW) { const s = minW / vb[2]; vb[0] -= vb[2] * (s - 1) / 2; vb[1] -= vb[3] * (s - 1) / 2; vb[2] = minW; vb[3] = minW * ch / cw; }
      const cx = Math.min(Math.max(vb[0] + vb[2] / 2, V[0]), V[0] + V[2]);
      const cy = Math.min(Math.max(vb[1] + vb[3] / 2, V[1]), V[1] + V[3]);
      vb[0] = cx - vb[2] / 2; vb[1] = cy - vb[3] / 2;
    }
    function draw() {
      if (!vb) return; // 表示位置が決まる前
      svg.setAttribute('viewBox', vb.map(v => v.toFixed(2)).join(' '));
      const s = vb[2] / size()[0]; // 1px あたりの地図上の長さ
      let h = '';
      // 市町名（画面上で十分な大きさがあるときだけ）
      CITY_NAMES.forEach(c => {
        const b = GEO.cities[c].b, l = GEO.cities[c].l;
        if ((b[2] - b[0]) / s > 70) h += `<text class="lbl" transform="translate(${l[0]} ${l[1]}) scale(${s})" font-size="12" stroke-width="3" text-anchor="middle">${c}</text>`;
      });
      if (opts.home) {
        const [hx, hy] = toXY(opts.home.lat, opts.home.lng);
        if (opts.radius) h += `<circle class="radius" cx="${hx}" cy="${hy}" r="${opts.radius * KM}" stroke-width="${2 * s}" style="stroke-dasharray:${6 * s} ${5 * s}"/>`;
        h += `<g transform="translate(${hx} ${hy}) scale(${s})" pointer-events="none"><circle r="15" fill="var(--tomato)" stroke="#2E2A24" stroke-width="2.5"/><text y="6" font-size="16" text-anchor="middle">🏠</text></g>`;
      }
      (opts.farms || []).forEach(f => {
        if (typeof f.lat !== 'number') return;
        const [x, y] = toXY(f.lat, f.lng);
        const sel = opts.selected === f.id;
        h += `<g class="mpin ${sel ? 'sel' : ''} ${opts.dim && opts.dim(f) ? 'far' : ''}" data-id="${esc(f.id)}" transform="translate(${x} ${y}) scale(${s * (sel ? 1.25 : 1)})">
          <circle r="17" cx="2" cy="2" fill="#2E2A24"/><circle class="bg" r="17" stroke-width="2.5"/><text y="7" font-size="19" text-anchor="middle">${esc(f.emoji)}</text></g>`;
      });
      if (opts.picked) {
        const [x, y] = toXY(opts.picked[0], opts.picked[1]);
        h += `<g transform="translate(${x} ${y}) scale(${s})" pointer-events="none"><path d="M0 0 L-11 -20 A13 13 0 1 1 11 -20 Z" fill="var(--tomato)" stroke="#2E2A24" stroke-width="2.5"/><circle cy="-26" r="5" fill="#fff"/></g>`;
      }
      over.innerHTML = h;
    }
    function zoom(factor, cx, cy) {
      if (!vb) return;
      if (cx === undefined) { cx = vb[0] + vb[2] / 2; cy = vb[1] + vb[3] / 2; }
      vb = [cx - (cx - vb[0]) * factor, cy - (cy - vb[1]) * factor, vb[2] * factor, vb[3] * factor];
      clamp(); draw();
    }
    function svgPoint(evt) {
      const r = svg.getBoundingClientRect();
      return [vb[0] + (evt.clientX - r.left) / r.width * vb[2], vb[1] + (evt.clientY - r.top) / r.height * vb[3]];
    }

    // ドラッグで移動・2本指で拡大縮小・タップで選択
    const pts = new Map();
    let start = null, moved = false, pinch = null;
    svg.addEventListener('pointerdown', e => {
      svg.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (!vb) return;
      if (pts.size === 1) { start = { x: e.clientX, y: e.clientY, vb: vb.slice() }; moved = false; }
      if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), vb: vb.slice() }; moved = true; }
    });
    svg.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      const r = svg.getBoundingClientRect();
      if (pts.size === 2 && pinch) {
        const [a, b] = [...pts.values()];
        const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        const cx = pinch.vb[0] + (mx - r.left) / r.width * pinch.vb[2], cy = pinch.vb[1] + (my - r.top) / r.height * pinch.vb[3];
        vb = pinch.vb.slice();
        zoom(pinch.d / Math.max(d, 1), cx, cy);
        return;
      }
      if (!start) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
      if (moved) {
        vb = [start.vb[0] - dx / r.width * start.vb[2], start.vb[1] - dy / r.height * start.vb[3], start.vb[2], start.vb[3]];
        clamp(); draw();
      }
    });
    const end = e => {
      pts.delete(e.pointerId);
      if (pts.size < 2) pinch = null;
      if (pts.size === 0 && start) {
        if (!moved && e.type === 'pointerup') {
          const hit = document.elementFromPoint(e.clientX, e.clientY);
          const pin = hit && hit.closest && hit.closest('.mpin');
          if (pin && opts.onSelect) opts.onSelect(pin.dataset.id);
          else if (opts.pickable && opts.onPick) {
            const [x, y] = svgPoint(e);
            const [lat, lng] = toLL(x, y);
            if (inYamaguchi(lat, lng)) { opts.picked = [Math.round(lat * 1000) / 1000, Math.round(lng * 1000) / 1000]; draw(); opts.onPick(opts.picked); }
          } else if (opts.onSelect) opts.onSelect(null);
        }
        start = null;
      }
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    $$('[data-z]', wrap).forEach(b => b.addEventListener('click', () => {
      if (b.dataset.z === 'in') zoom(0.6); else if (b.dataset.z === 'out') zoom(1 / 0.6); else fitAll();
    }));

    const ctl = {
      update(o) { Object.assign(opts, o); draw(); },
      showAround(lat, lng, radiusKm) { fit(boxAround(lat, lng, radiusKm)); },
      showCity(c) { const b = GEO.cities[c].b; fit([b[0] - 10, b[1] - 10, b[2] + 10, b[3] + 10]); },
      showAll: fitAll
    };
    // 表示サイズが決まってから位置合わせする
    requestAnimationFrame(() => { if (opts.initial) opts.initial(ctl); else fitAll(); });
    return ctl;
  }

        </div>

  function filteredFarms() {
    const q = state.q.trim().toLowerCase();
    return DATA.farms.filter(f => {
      if (state.cat !== 'all' && !cats(f).includes(state.cat)) return false;
      if (state.pest !== 'all' && f.methods?.pesticide !== state.pest) return false;
      if (state.inSeason && !inSeasonNow(f)) return false;
      if (state.pickupOnly && !canPickup(f)) return false;
      if (q) {
        const hay = [f.farmName, f.farmer, f.city, f.catch, f.story, ...(f.products || []).map(p => p.name)].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

    const withDist = () => filteredFarms().map(f => ({ f, d: home ? km(home, f) : null }))
      .sort((a, b) => (a.d ?? 0) - (b.d ?? 0));
    const ymap = YMap($('#map'), {
      home, radius: home ? state.rad : 0, farms: [],
      initial: m => { if (home && state.rad) m.showAround(home.lat, home.lng, state.rad * 1.25); else m.showAll(); },
      onSelect: id => { state.mapSel = id; ymap.update({ selected: id }); drawPick(); }
    });
    function drawPick() {
      const f = state.mapSel && findFarm(state.mapSel);
      $('#mapPick').innerHTML = f ? `
        <a class="mini" href="#/farm/${esc(f.id)}"><span class="em" style="background:${hue(f)}">${esc(f.emoji)}</span>
          <span class="tx"><b>${esc(f.farmName)}</b><br><span class="small dim">${esc(f.city)}${home ? ` ・ 🚗 ${fmtKm(km(home, f))}` : ''}${canPickup(f) ? ' ・ 受け取りOK' : ''}</span></span>
          <span class="go">見る →</span></a>` : '<p class="small dim" style="margin:0">ピンをタップすると農家さんが表示されます。</p>';
    }

    function update() {
      const all = withDist();
      const near = home && state.rad ? all.filter(x => x.d <= state.rad) : all;
      const far = home && state.rad ? all.filter(x => x.d > state.rad) : [];
      $('#listTitle').textContent = home && state.rad ? `${state.rad}km以内の農家さん` : (home ? '近い順' : '農家さん');

        : `<div class="empty">${home && state.rad ? `${state.rad}km以内には、条件に合う農家さんがまだいません。<br>範囲を広げるか、下の農家さんも見てみてください。` : '条件に合う農家さんが見つかりませんでした。'}</div>`;
      $('#farWrap').hidden = !far.length;
      $('#farCount').textContent = `${far.length}件`;
      $('#farList').innerHTML = far.map(x => farmCard(x.f, x.d)).join('');
      if (state.mapSel && !all.some(x => x.f.id === state.mapSel)) state.mapSel = null;
      ymap.update({ farms: all.map(x => x.f), selected: state.mapSel, dim: f => home && state.rad && km(home, f) > state.rad });
      drawPick();

    $('#changeHome').addEventListener('click', () => { state.changingHome = true; renderWelcome(); window.scrollTo(0, 0); });
    $$('#radChips [data-rad]').forEach(b => b.addEventListener('click', () => {
      state.rad = Number(b.dataset.rad);

      ymap.update({ radius: state.rad });
      if (state.rad) ymap.showAround(home.lat, home.lng, state.rad * 1.25); else ymap.showAll();
      update();
    }));
    $('#q').addEventListener('input', e => { state.q = e.target.value; update(); });
    $('#pest').addEventListener('change', e => { state.pest = e.target.value; update(); });
    $$('#catChips [data-cat]').forEach(b => b.addEventListener('click', () => {
      state.cat = b.dataset.cat;

      update();

    $('#pickupChip').addEventListener('click', e => { state.pickupOnly = !state.pickupOnly; e.currentTarget.classList.toggle('on', state.pickupOnly); update(); });
    update();
  }

  // ---------- 画面: 注文 ----------
  const STATUS = {
    ship: [['paid', 'お支払い済み'], ['shipped', '発送済み'], ['done', 'お届け完了']],
    pickup: [['paid', 'お支払い済み'], ['ready', '準備OK'], ['done', '受け取り完了']]
  };
  function statusLabel(o) {
    if (o.status === 'pending_payment') return 'お支払い待ち';
    if (o.status === 'canceled') return 'キャンセル済み';
    if (o.status === 'expired') return '取り消し';
    return (STATUS[o.method].find(s => s[0] === o.status) || [, ''])[1];
  }
  function statusSteps(o) {
    if (['pending_payment', 'canceled', 'expired'].includes(o.status)) return '';
    const st = STATUS[o.method];
    const idx = st.findIndex(s => s[0] === o.status);
    return `<div class="steps">${st.map((s, i) => `<div class="${i <= idx ? 'on' : ''}">${s[1]}</div>`).join('')}</div>`;
  }
  const canCancel = o => o.status === 'paid' && Date.now() < new Date(o.cancelDeadline).getTime();
  function orderCard(o) {
    return `
      <a class="order box" href="#/order/${esc(o.id)}">
        <div class="head"><b>${esc(o.farmEmoji)} ${esc(o.farmName)}</b><span class="status ${esc(o.status)}">${esc(statusLabel(o))}</span></div>
        <div class="small dim">${fmtDate(o.createdAt)} 注文 ・ ${o.method === 'pickup' ? `🚗 ${fmtDay(o.pickup.date)} ${esc(o.pickup.time)} 受け取り` : '📦 配送'}</div>
        <div class="small">${o.items.map(i => `${esc(i.name)}×${i.qty}`).join('、')}</div>

      </a>`;

  async function renderOrder(id, isNew) {
    if (needLogin()) {
      app.innerHTML = `<div style="margin-top:16px">${loginPanel('注文を見るには、ログインが必要です。', location.hash)}</div>`;
      bindLogin(location.hash, () => renderOrder(id, isNew));
      return;
    }
    let o = await api.order(id);
    // Stripe から戻った直後は、支払い完了の通知が少し遅れて届くことがある
    for (let i = 0; o && isNew && o.status === 'pending_payment' && i < 5; i++) {
      await new Promise(r => setTimeout(r, 1500));
      o = await api.order(id);
    }
    if (!o) { app.innerHTML = '<a class="back" href="#/orders">← 注文一覧へ</a><div class="empty">注文が見つかりませんでした。</div>'; return; }

    const loc = { lat: o.farmLat ?? f?.lat, lng: o.farmLng ?? f?.lng };
    let cancelHtml = '';
    if (o.status === 'pending_payment') cancelHtml = `
      <div class="cancel-box">お支払いがまだ完了していません。30分以内にお支払いがないと、自動で取り消されます。
        <div class="actions" style="margin-top:10px">${o.checkoutUrl ? `<a class="btn" href="${esc(o.checkoutUrl)}">お支払いへ進む</a>` : ''}<button class="btn danger" id="cancelBtn">注文をやめる</button></div></div>`;
    else if (canCancel(o)) cancelHtml = `
      <div class="cancel-box">↩️ <b>${fmtDateTime(o.cancelDeadline)}</b> まで、キャンセルできます（全額返金）。
        <div style="margin-top:10px"><button class="btn danger small" id="cancelBtn">この注文をキャンセルする</button></div></div>`;
    else if (o.status === 'paid') cancelHtml = '<div class="cancel-box">キャンセルの期限を過ぎました。ご都合が悪くなった場合は、農家さんにお電話でご相談ください。</div>';
    else if (o.status === 'ready' || o.status === 'shipped') cancelHtml = '<div class="cancel-box">農家さんが準備を始めたため、キャンセルはできません。</div>';
    else if (o.status === 'canceled') cancelHtml = `<div class="cancel-box">この注文はキャンセルしました。${o.refundStatus === 'failed' ? '返金の手続きでエラーが起きたため、運営からご連絡します。' : '代金は全額返金されます（カード会社によって反映まで数日かかります）。'}</div>`;
    else if (o.status === 'expired') cancelHtml = '<div class="cancel-box">お支払いが完了しなかったため、この注文は取り消されました。</div>';

    app.innerHTML = `
      <a class="back" href="#/orders">← 注文一覧へ</a>
      ${isNew && o.status === 'paid' ? `<section class="hero-intro"><span class="float a">🎉</span><h1>ご注文ありがとうございます！</h1><p>${esc(o.farmName)}さんに注文が届きました。</p></section>` : ''}

          <p class="small" style="margin:0">📍 ${esc(o.pickup.place)}${typeof loc.lat === 'number' ? ` ・ <a href="${gmapUrl(loc)}" target="_blank" rel="noopener">Googleマップで道順を見る</a>` : ''}</p>

        : `<p class="small" style="margin:8px 0 0">お届け先：〒${esc(o.ship.zip)} ${esc(o.ship.pref)} ${esc(o.ship.addr)}</p>
           <p class="small dim" style="margin:4px 0 0">発送されたら、ここの状況が「発送済み」に変わります。</p>`}
        ${cancelHtml}
      </div>
      <h2 class="sec"><span class="ic">🧾</span>ご注文内容</h2>
      <div class="panel">
        <table class="lines">
          ${o.items.map(i => `<tr><td>${esc(i.name)}<br><span class="small dim">${esc(i.unit)} × ${i.qty}</span></td><td class="r">${yen(i.price * i.qty)}</td></tr>`).join('')}
          <tr class="total"><td>合計 <span class="small dim">${pickup ? '（送料なし）' : '（送料込み）'}</span></td><td class="r">${yen(o.total)}</td></tr>
        </table>
        <p class="small dim" style="margin:8px 0 0">注文番号 ${esc(String(o.id).slice(0, 8))}${api.mode === 'demo' ? '（お試し版）' : ''}</p>
      </div>
      <div class="actions"><a class="btn leaf" href="#/farm/${esc(o.farmId)}">${esc(o.farmName)}のページへ</a>
      ${o.status === 'done' ? `<a class="btn corn" href="#/farm/${esc(o.farmId)}">💌 感想を届ける</a>` : ''}</div>
    `;
    const cb = $('#cancelBtn');
    if (cb) cb.addEventListener('click', async () => {
      if (!confirm(o.status === 'pending_payment' ? 'この注文をやめますか？' : 'この注文をキャンセルしますか？\n代金は全額返金されます。')) return;
      cb.disabled = true;
      try {
        await api.cancelOrder(o.id);
        await reload();
        toast(o.status === 'pending_payment' ? '注文をやめました' : 'キャンセルしました');
        renderOrder(o.id, false);
        updateBadge();
      } catch (err) { toast(err.message); cb.disabled = false; }
    });
  }

  // ---------- 画面: 畑だより ----------

    const shown = items.filter(x => state.feedMode === 'all' || fl.includes(x.f.id)).sort((a, b) => String(b.p.date).localeCompare(String(a.p.date)));
    app.innerHTML = `
      <section class="hero-intro"><span class="float a">📰</span><h1>畑だより</h1><p>いま、山口の畑で起きていること。</p></section>

          <button data-mode="all" class="${state.feedMode === 'all' ? 'on' : ''}">すべて</button>

  let editingIdx = -1;

  function blankFarm() {
    return {
      id: null, farmName: '', farmer: '', city: '', lat: null, lng: null, latPicked: false,
      since: '', area: '', emoji: '🥬', hue: 0, catch: '', story: '', cancelDays: 2,
      methods: { pesticide: 'conventional', fertilizer: 'conventional', style: '露地', soil: '' },

  function farmerOrderCards(list) {
    if (!list.length) return '<div class="empty">まだ注文はありません。</div>';
    return list.map(o => {
      const pickup = o.method === 'pickup';
      let act = '';
      if (o.status === 'paid') act = `
        <div class="small dim">お客さんは ${fmtDateTime(o.cancelDeadline)} までキャンセルできます。準備を始めると、キャンセルできなくなります。</div>
        <div><button class="btn corn small" data-adv="${esc(o.id)}" data-to="${pickup ? 'ready' : 'shipped'}">${pickup ? '準備できた' : '発送した'}</button></div>`;
      else if (o.status === 'ready') act = `
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <input data-code-for="${esc(o.id)}" inputmode="numeric" maxlength="4" placeholder="受け取りコード" aria-label="受け取りコード" style="width:140px;padding:4px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--surface-2)">
          <button class="btn leaf small" data-done="${esc(o.id)}">受け渡し完了</button></div>`;
      else if (o.status === 'shipped') act = `<div><button class="btn leaf small" data-adv="${esc(o.id)}" data-to="done">お届け完了にする</button></div>`;
      return `
        <div class="order box">
          <div class="head"><b>${esc(o.buyer.name)} さん</b><span class="status ${esc(o.status)}">${esc(statusLabel(o))}</span></div>
          <div class="small">${pickup ? `🚗 <b>${fmtDay(o.pickup.date)} ${esc(o.pickup.time)}</b> に受け取り` : `📦 配送：〒${esc(o.ship.zip)} ${esc(o.ship.pref)} ${esc(o.ship.addr)}`}</div>
          <div class="small">${o.items.map(i => `${esc(i.name)}（${esc(i.unit)}）×${i.qty}`).join('、')}</div>
          ${pickup && o.pickup.msg ? `<div class="cheer small">💬 ${esc(o.pickup.msg)}</div>` : ''}
          <div class="small dim">📞 ${esc(o.buyer.tel)} ・ ${yen(o.total)}${o.status === 'canceled' ? '（キャンセル・返金済み）' : '（支払い済み）'}</div>

        </div>`;
    }).join('');
  }

    const cn = $('#connectBtn');
    if (cn) cn.addEventListener('click', async () => {
      cn.disabled = true;
      try { const r = await api.connect('onboard'); location.href = r.url; } catch (err) { toast(err.message); cn.disabled = false; }
    });

    // 注文管理
    function bindOrders() {
      $$('[data-adv]').forEach(b => b.addEventListener('click', async () => {
        if (b.dataset.to !== 'done' && !confirm('準備を始めると、お客さんはキャンセルできなくなります。よろしいですか？')) return;
        try { await api.updateOrder(b.dataset.adv, b.dataset.to); toast('更新しました'); } catch (err) { toast(err.message); }
        $('#farmerOrders').innerHTML = farmerOrderCards(await api.farmOrders(f.id)); bindOrders(); updateBadge();
      }));
      $$('[data-done]').forEach(b => b.addEventListener('click', async () => {
        const input = $(`[data-code-for="${CSS.escape(b.dataset.done)}"]`);
        try { await api.updateOrder(b.dataset.done, 'done', input.value.trim()); toast('受け渡し完了！ありがとうございました'); }
        catch (err) { toast(err.message); input.focus(); return; }
        $('#farmerOrders').innerHTML = farmerOrderCards(await api.farmOrders(f.id)); bindOrders(); updateBadge();
      }));
    }
    if (existing) bindOrders();

    // 位置
    let picked = f.latPicked && typeof f.lat === 'number' ? [f.lat, f.lng] : null;
    const pm = YMap($('#pickMap'), {
      small: true, pickable: true, picked, focusCity: f.city,
      initial: m => { if (picked) m.showAround(picked[0], picked[1], 8); else if (f.city) m.showCity(f.city); else m.showAll(); },
      onPick: p => { picked = p; $('#pickInfo').textContent = '📍 指定しました'; }
    });
    $('#fCity').addEventListener('change', e => {
      if (!CITY_CENTER[e.target.value]) return;
      $$('#pickMap .city').forEach(el => el.classList.toggle('focus', el.dataset.city === e.target.value));
      if (!picked) pm.showCity(e.target.value);
    });

    const togglePk = () => { $('#pkFields').hidden = !$('#pkOn').checked; $('#nPick').disabled = !$('#pkOn').checked; };
    $('#pkOn').addEventListener('change', togglePk);
    togglePk();

    function drawProducts() {
      const pkOn = $('#pkOn').checked;
      $('#prodList').innerHTML = draftProducts.length ? draftProducts.map((p, i) => `
        <div class="prod-item"><span><b>${esc(p.name)}</b>（${esc(p.unit)}）<br><span class="dim small">${p.months.length === 12 ? '通年' : p.months.map(mm => mm + '月').join(' ')} ・ 配送${yen(p.shipPrice)}${pkOn ? ` / 受取${yen(p.pickupPrice)}` : ''} ・ 在庫${Number(p.stock) || 0}</span></span>
        <button class="btn ghost small" type="button" data-ed="${i}">編集</button>
        <button class="btn danger small" type="button" data-rm="${i}">削除</button></div>`).join('')
        : '<div class="small dim">まだ品目がありません。下のフォームから追加してください。</div>';
      $$('#prodList [data-rm]').forEach(b => b.addEventListener('click', () => { draftProducts.splice(Number(b.dataset.rm), 1); resetEditor(); drawProducts(); }));
      $$('#prodList [data-ed]').forEach(b => b.addEventListener('click', () => loadEditor(Number(b.dataset.ed))));
    }
    $('#pkOn').addEventListener('change', drawProducts);
    function resetEditor() {
      editingIdx = -1;
      ['#nName', '#nUnit', '#nShip', '#nPick', '#nNote'].forEach(s => { $(s).value = ''; });
      $('#nStock').value = 10;
      $$('#nMonths input').forEach(i => { i.checked = false; });
      $('#addProd').textContent = '＋ この品目を追加';
      $('#cancelEdit').hidden = true;
    }
    function loadEditor(i) {
      const p = draftProducts[i];
      editingIdx = i;
      $('#nName').value = p.name; $('#nCat').value = p.cat; $('#nUnit').value = p.unit || '';
      $('#nStock').value = Number(p.stock) || 0; $('#nShip').value = p.shipPrice; $('#nPick').value = p.pickupPrice; $('#nNote').value = p.note || '';
      $$('#nMonths input').forEach(x => { x.checked = p.months.includes(Number(x.value)); });
      $('#addProd').textContent = '✓ この内容で更新';
      $('#cancelEdit').hidden = false;
      $('#prodEditor').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    $('#cancelEdit').addEventListener('click', resetEditor);
    drawProducts();

    $('#addProd').addEventListener('click', () => {
      const name = $('#nName').value.trim();
      const months = $$('#nMonths input:checked').map(i => Number(i.value));
      const ship = Number($('#nShip').value);
      const pickOn = $('#pkOn').checked;
      const pick = pickOn ? Number($('#nPick').value) : ship;
      if (!name) { toast('品目名を入力してください'); $('#nName').focus(); return; }
      if (!$('#nUnit').value.trim()) { toast('1セットの量を入力してください'); $('#nUnit').focus(); return; }
      if (!(ship > 0)) { toast('県内配送の価格（送料込み）を入力してください'); $('#nShip').focus(); return; }
      if (pickOn && !(pick > 0)) { toast('畑で受け取りの価格を入力してください'); $('#nPick').focus(); return; }
      if (pick > ship) { toast('受け取りの価格は、配送の価格以下にしてください'); $('#nPick').focus(); return; }
      if (!months.length) { toast('お届けできる月を1つ以上選んでください'); return; }
      const prev = editingIdx >= 0 ? draftProducts[editingIdx] : null;
      const p = { id: prev ? prev.id : 'new-' + uid(), name, cat: $('#nCat').value, months, note: $('#nNote').value.trim(), unit: $('#nUnit').value.trim(), shipPrice: ship, pickupPrice: pick, stock: Math.max(0, Number($('#nStock').value) || 0) };
      if (prev) draftProducts[editingIdx] = p; else draftProducts.push(p);
      resetEditor();
      drawProducts();
      toast(prev ? '品目を更新しました（保存ボタンで確定）' : '品目を追加しました（保存ボタンで確定）');
    });

    $('#farmForm').addEventListener('submit', async e => {
      e.preventDefault();
      const need = [['#fName', '農園名'], ['#fFarmer', 'お名前'], ['#fCity', '市町'], ['#fCatch', 'ひとこと'], ['#fStory', '想い']];
      const miss = need.find(([s]) => !$(s).value.trim());
      if (miss) { toast(`${miss[1]}を入力してください`); $(miss[0]).focus(); return; }
      if (!draftProducts.length) { toast('売るものを1つ以上追加してください'); $('#nName').focus(); return; }
      const pkOn = $('#pkOn').checked;
      const pkDays = $$('input[name=pkDay]:checked').map(i => Number(i.value));
      const from = Number($('#pkFrom').value), to = Number($('#pkTo').value);
      if (pkOn && !pkDays.length) { toast('受け取りできる曜日を選んでください'); return; }
      if (pkOn && to <= from) { toast('受け取り時間の「まで」は「から」より後にしてください'); $('#pkTo').focus(); return; }
      if (pkOn && draftProducts.some(p => !(p.pickupPrice > 0) || p.pickupPrice > p.shipPrice)) { toast('畑で受け取りの価格が未設定の品目があります。「編集」から設定してください'); return; }
      const city = $('#fCity').value;
      const pos = picked || CITY_CENTER[city];
      const emoji = ($('input[name=fEmoji]:checked') || {}).value || '🥬';
      const saved = Object.assign({}, f, {
        farmName: $('#fName').value.trim(), farmer: $('#fFarmer').value.trim(), city,
        lat: pos[0], lng: pos[1], latPicked: !!picked,
        since: $('#fSince').value ? Number($('#fSince').value) : '', area: $('#fArea').value.trim(),
        emoji, hue: Math.max(0, EMOJIS.indexOf(emoji)) % HUES.length,
        catch: $('#fCatch').value.trim(), story: $('#fStory').value.trim(),
        methods: { pesticide: $('#fPest').value, fertilizer: $('#fFert').value, style: $('#fStyle').value, soil: $('#fSoil').value.trim() },
        certs: $('#fCerts').value.split(/[,、，]/).map(s => s.trim()).filter(Boolean),
        pickup: { enabled: pkOn, place: $('#pkPlace').value.trim(), days: pkDays, from, to, note: $('#pkNote').value.trim() },
        cancelDays: Number($('#fCancel').value),
        products: draftProducts.map(p => Object.assign({}, p, pkOn ? {} : { pickupPrice: p.shipPrice }))
      });
      const btn = $('#saveFarm');
      btn.disabled = true;
      try {
        const id = await api.saveFarm(saved);
        draftProducts = null;
        await reload();
        toast(existing ? '保存しました' : (api.mode === 'live' ? '登録しました！次に、売上の受け取り口座を登録してください' : '登録しました！畑だよりも書いてみましょう'));
        if (existing || api.mode === 'live') { renderMine(); window.scrollTo(0, 0); } else location.hash = `#/farm/${id}`;
      } catch (err) { toast('保存できませんでした：' + (err.message || '')); btn.disabled = false; }
    });

    const del = $('#deleteFarm');
    if (del) del.addEventListener('click', async () => {
      if (!confirm('農園の登録と、畑だよりをすべて削除します。よろしいですか？')) return;
      const r = await api.deleteFarm(f);
      draftProducts = null;
      await reload();
      toast(r === 'hidden' ? '注文の記録があるため、削除ではなく非公開にしました' : '削除しました');
      renderMine();
    });

    const pf = $('#postForm');
    if (pf) pf.addEventListener('submit', async e => {
      e.preventDefault();
      const title = $('#pTitle').value.trim();
      if (!title) return;
      try {
        await api.addPost(f.id, { emoji: ($('input[name=pEmoji]:checked') || {}).value || f.emoji, title, body: $('#pBody').value.trim() });
        await reload();
        toast('畑だよりを投稿しました');
        draftProducts = null;
        renderMine();
      } catch (err) { toast('投稿できませんでした：' + (err.message || '')); }
    });
    $$('[data-del-post]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('この投稿を削除しますか？')) return;
      await api.deletePost(b.dataset.delPost);
      await reload();
      draftProducts = null;
      renderMine();
    }));
  }

  // ---------- ルーティング ----------
  async function updateBadge() {
    let n = 0;
    try { if (!needLogin()) n = (await api.myOrders()).filter(o => ['paid', 'ready', 'shipped'].includes(o.status)).length; } catch (e) { /* noop */ }
    const a = $('#tabs a[data-tab=orders]');
    const b = a.querySelector('.badge');
    if (n && !b) a.insertAdjacentHTML('beforeend', `<span class="badge">${n}</span>`);
    else if (n && b) b.textContent = n;
    else if (!n && b) b.remove();
  }
  let routeSeq = 0;
  async function route() {
    const seq = ++routeSeq;
    $('#cartbarSlot').innerHTML = '';
    const raw = location.hash.replace(/^#/, '') || '/';
    const [path, query] = raw.split('?');
    const parts = path.split('/').filter(Boolean);
    let tab = 'explore';
    if (parts[0] !== 'mine') { draftProducts = null; editingIdx = -1; }
    if (parts[0] !== '' && parts[0] !== undefined) state.changingHome = false;
    $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === (parts[0] === 'farm' || parts[0] === 'checkout' ? '' : (parts[0] === 'order' ? 'orders' : (parts[0] || 'explore')))));
    window.scrollTo(0, 0);
    try {
      if (parts[0] === 'farm' && parts[1]) { tab = ''; await renderFarm(decodeURIComponent(parts[1])); }
      else if (parts[0] === 'checkout' && parts[1]) { tab = ''; renderCheckout(decodeURIComponent(parts[1])); }
      else if (parts[0] === 'order' && parts[1]) { tab = 'orders'; await renderOrder(decodeURIComponent(parts[1]), /(^|&)new=1/.test(query || '')); }
      else if (parts[0] === 'orders') { tab = 'orders'; await renderOrders(); }
      else if (parts[0] === 'feed') { tab = 'feed'; renderFeed(); }
      else if (parts[0] === 'follows') { tab = 'follows'; renderFollows(); }
      else if (parts[0] === 'mine') { tab = 'mine'; await renderMine(query); }
      else renderExplore();
    } catch (err) {
      console.error(err);
      if (seq === routeSeq) app.innerHTML = `<div class="empty">読み込みに失敗しました。通信状況を確認して、もう一度お試しください。<br><small>${esc(err.message || '')}</small></div>`;
    }
    if (seq === routeSeq) updateBadge();
  }
  window.addEventListener('hashchange', route);

  // ---------- テーマ ----------
  function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
  applyTheme(store.get(KEY.theme, null));
  $('#themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    store.set(KEY.theme, next);
  });

  // ---------- 起動 ----------
  (async () => {
    if (WANT_LIVE) {
      try { await live.init(); api = live; } catch (err) {
        console.error(err);
        app.innerHTML = '<div class="empty">サーバーに接続できませんでした。通信状況を確認して、ページを開きなおしてください。</div>';
        return;
      }
    }
    $('#modeTag').hidden = api.mode !== 'demo';
    try { await reload(); } catch (err) {
      console.error(err);
      app.innerHTML = '<div class="empty">農家さんの情報を読み込めませんでした。ページを開きなおしてください。</div>';
      return;
    }
    route();
  })();
})();
</script>
</body>
</html>
